<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시 앱 설정 · FILT</title>
  <style>
    body { margin: 0; padding: 24px 16px; font: 16px/1.6 system-ui, sans-serif; color: #111; background: #f4f4f2; }
    main { max-width: 520px; margin: 0 auto; padding: 22px; border: 1px solid #111; background: #fff; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    button { width: 100%; padding: 14px; border: 0; background: #111; color: #fff; font: inherit; font-weight: 600; }
    .code { margin: 14px 0; padding: 14px; border: 1px dashed #111; font: 600 18px ui-monospace, monospace; word-break: break-all; user-select: all; }
    .muted { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    // One-time setup: creates the org-owned GitHub App that lets the editor repo's
    // Actions publish to this public repo (GitHub App manifest flow).
    const ORG = "filt-office";
    const here = location.origin + location.pathname;
    const manifest = {
      name: "filt-office-publisher",
      url: "https://filt-office.github.io/filt-project-templates/builder/",
      hook_attributes: { url: "https://filt-office.github.io/filt-project-templates/", active: false },
      redirect_url: here,
      public: false,
      default_permissions: { contents: "write", metadata: "read" },
      default_events: [],
    };
    const app = document.getElementById("app");
    const code = new URLSearchParams(location.search).get("code");

    if (code) {
      app.innerHTML = `
        <h1>앱이 만들어졌습니다 ✓</h1>
        <p>아래 코드를 Claude 채팅에 그대로 보내주세요. <b>1시간 안에</b> 한 번만 쓸 수 있는 코드입니다.</p>
        <div class="code"></div>
        <button id="copy">코드 복사</button>
        <p class="muted">이 페이지는 닫아도 됩니다.</p>`;
      app.querySelector(".code").textContent = code;
      app.querySelector("#copy").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(code); app.querySelector("#copy").textContent = "복사됨"; } catch { /* select manually */ }
      });
    } else {
      app.innerHTML = `
        <h1>FILT 게시 앱 만들기</h1>
        <p>빌더의 '게시' 버튼이 공개 저장소에 반영할 수 있도록, <b>${ORG}</b> 조직 소유의 GitHub App을 만듭니다.</p>
        <ol>
          <li>아래 버튼을 누릅니다.</li>
          <li>GitHub 화면에서 <b>Create GitHub App for ${ORG}</b>를 누릅니다.</li>
          <li>이 페이지로 돌아오면 나오는 코드를 Claude에게 보냅니다.</li>
        </ol>
        <form method="post" action="https://github.com/organizations/${ORG}/settings/apps/new?state=filt-setup">
          <input type="hidden" name="manifest">
          <button type="submit">앱 만들기</button>
        </form>
        <p class="muted">권한: 저장소 내용 읽기·쓰기만. 설치할 저장소는 다음 단계에서 고릅니다.</p>`;
      app.querySelector('[name="manifest"]').value = JSON.stringify(manifest);
    }
  </script>
</body>
</html>
