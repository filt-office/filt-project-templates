<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORKS · FILT. BUILDER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suit-font@1.0.0/dist/suit.min.css">
  <style>
    :root {
      --key: var(--filt-key, #BD005E);
      --line: #d9d9d9;
      --muted: #777;
      --bg: #f4f4f2;
      --danger: #c62828;
      --warn: #f2b705;
      --row-h: 34px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto auto 1fr;
      font: 12px/1.4 "SUIT", system-ui, sans-serif;
      color: #111;
      background: var(--bg);
    }
    button, input, select { font: inherit; color: inherit; }
    button {
      padding: 4px 9px;
      border: 1px solid #111;
      border-radius: 0;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #111; color: #fff; }
    button.primary { background: #111; color: #fff; }
    button.small { padding: 1px 5px; font-size: 11px; border-color: var(--line); }
    button.small:hover { border-color: #111; }
    button.danger:hover { background: var(--danger); border-color: var(--danger); }
    button:disabled { opacity: .35; pointer-events: none; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
    a { color: inherit; }

    .spacer { flex: 1; }
    .dirty { color: var(--danger); visibility: hidden; }
    .dirty.show { visibility: visible; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .filters input[type="search"], .filters select { padding: 4px 6px; border: 1px solid var(--line); background: #fff; }
    .filters input[type="search"] { width: 200px; }
    .filters label { display: flex; align-items: center; gap: 4px; }
    .count { color: var(--muted); }

    .sheet-wrap { overflow: auto; min-height: 0; }
    table { border-collapse: separate; border-spacing: 0; min-width: 100%; background: #fff; }
    th, td {
      height: var(--row-h);
      padding: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      white-space: nowrap;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 0 6px;
      background: #111;
      color: #fff;
      font-weight: 500;
      text-align: left;
    }
    thead th.group { text-align: center; }
    tbody tr:hover td { background: #fafafa; }
    tbody tr.has-note td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
    tbody tr.category-start td { border-top: 2px solid #111; }
    td.num { width: 34px; padding: 0 6px; color: var(--muted); text-align: right; }
    td input[type="text"], td select {
      width: 100%;
      height: var(--row-h);
      padding: 0 6px;
      border: 0;
      background: transparent;
    }
    td select.category { width: 128px; }
    td input[data-key="nameKo"] { width: 170px; }
    td input[data-key="nameEn"] { width: 210px; }
    td input[data-key="year"] { width: 86px; }
    td input[data-key="program"], td input[data-key="status"] { width: 110px; }
    td input[data-key="location"] { width: 96px; }
    td input[data-key="id"] { width: 190px; }
    td input:focus, td select:focus { outline: 2px solid var(--key); outline-offset: -2px; background: #fff; }
    td.edited { max-width: 260px; overflow: hidden; padding: 0 6px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; }
    td.mono input { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    td.thumb-cell { width: 64px; }
    /* Image cell: a faint X marks an empty placeholder; an image fills the cell (cover). */
    .thumb { position: relative; display: block; width: 100%; min-width: 56px; height: var(--row-h); background: center / cover no-repeat; cursor: pointer; }
    .thumb.empty { background-image: linear-gradient(to top right, transparent calc(50% - .6px), #d4d4d4 50%, transparent calc(50% + .6px)), linear-gradient(to bottom right, transparent calc(50% - .6px), #d4d4d4 50%, transparent calc(50% + .6px)); }
    .thumb:hover, .thumb:focus-visible, .thumb.drop { box-shadow: inset 0 0 0 2px var(--key); outline: none; }
    .thumb.busy { opacity: .45; pointer-events: none; }
    .thumb .x { position: absolute; top: 0; right: 0; display: none; width: 15px; height: 15px; padding: 0; border: 0; background: #111; color: #fff; font-size: 9px; line-height: 15px; }
    .thumb:hover .x { display: block; }
    .thumb .x:hover { background: var(--danger); }
    td.num.grip { cursor: grab; user-select: none; }
    tr.dragging { opacity: .4; }
    tr.drop-before > td { box-shadow: inset 0 2px 0 #111; }
    tr.drop-after > td { box-shadow: inset 0 -2px 0 #111; }
    /* 상세페이지: 게시 / 편집 / N장 fill the cell edge to edge. */
    td.detail { min-width: 156px; }
    .detail-box { display: flex; height: var(--row-h); }
    .detail-box > * { display: grid; flex: 1; place-items: center; height: 100%; padding: 0 8px; border: 0; border-right: 1px solid var(--line); background: none; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .detail-box > :last-child { border-right: 0; }
    .detail-box .on { color: #111; font-weight: 700; }
    .detail-box button { color: #111; }
    .detail-box button:hover { background: #111; color: #fff; }
    td.note input { min-width: 260px; color: #8a6400; }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      max-width: 460px;
      padding: 10px 14px;
      background: #111;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: pre-line;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--danger); }
    .preview-panel {
      position: fixed;
      inset: var(--panel-top, 120px) 0 0;
      z-index: 15;
      display: grid;
      grid-template-rows: auto 1fr;
      border-top: 1px solid #111;
      background: var(--bg);
    }
    .preview-panel[hidden] { display: none; }
    .preview-bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #fff; }
    .preview-bar button.active { background: #111; color: #fff; }
    .stage { position: relative; overflow: hidden; }
    .stage-inner { position: absolute; top: 12px; left: 50%; transform-origin: top center; box-shadow: 0 0 0 1px #111, 0 6px 24px rgba(0,0,0,.12); background: #fff; }
    .stage iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    #thumbPopup {
      position: fixed;
      z-index: 20;
      display: none;
      width: 260px;
      height: 180px;
      border: 1px solid #111;
      background: #fff center / contain no-repeat;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header class="fb-header" data-active="works-list">
    <div class="fb-actions" id="account">
      <span class="dirty" id="dirty" title="저장 안 됨">●</span>
      <button class="fb-act" disabled title="WORKS 목록은 임시저장이 없습니다. save가 바로 게시 대상에 저장합니다.">draft</button>
      <button id="save" class="fb-act" title="저장 (Ctrl+S)">save</button>
    </div>
  </header>
  <script src="header.js"></script>
  <div class="filters">
    <button id="togglePreview" type="button" class="fb-preview-toggle" aria-label="미리보기" aria-controls="previewPanel" aria-expanded="false" title="미리보기 펼치기">미리보기</button>
    <input type="search" id="search" aria-label="WORKS 검색" placeholder="이름·지역·용도 검색">
    <select id="categoryFilter" aria-label="분류 필터"></select>
    <label><input type="checkbox" id="noteOnly" aria-label="확인 필요만 표시"> 확인 필요만</label>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <span class="count">엑셀 범위 붙여넣기 가능 · Enter: 아래 칸 · 번호를 끌어 순서 변경 · 우클릭: 보관/삭제</span>
  </div>
  <div class="sheet-wrap" id="sheetWrap">
    <table>
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">분류</th>
          <th scope="col">한글명</th>
          <th scope="col">영문명</th>
          <th scope="col">연도</th>
          <th scope="col">용도</th>
          <th scope="col">지역</th>
          <th scope="col">상태</th>
          <th scope="col">썸네일 (목록)</th>
          <th scope="col">상세페이지</th>
          <th scope="col">ID</th>
          <th scope="col" title="저장할 때 자동으로 적힙니다: 누가 · 언제 · 바뀐 칸">최근 수정</th>
          <th scope="col">확인 필요 메모</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="addRowControl"></div>
  </div>
  <section class="preview-panel" id="previewPanel" hidden>
    <div class="preview-bar">
      <strong>미리보기</strong>
      <button data-device="desktop" class="active">PC</button>
      <button data-device="mobile">모바일</button>
      <span class="count" id="previewSize"></span>
      <span class="spacer"></span>
      <span class="count">저장 전 내용 기준</span>
      <button id="closePreview">닫기</button>
    </div>
    <div class="stage" id="stage"><div class="stage-inner" id="stageInner"><iframe id="previewFrame" title="Works 미리보기"></iframe></div></div>
  </section>
  <div id="thumbPopup"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="store.js"></script>
  <script src="add-controls.js"></script>
  <script src="row-menu.js"></script>
  <script>
    // Old builder links: ./?id=… opened a project (now project.html), ./?view=gallery the gallery.
    if (new URLSearchParams(location.search).has("id")) location.replace(`project.html${location.search}`);
    else if (new URLSearchParams(location.search).get("view") === "gallery") location.replace("works-gallery.html");
  (() => {
    "use strict";

    const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
    // Text columns in display order; used for keyboard moves and spreadsheet paste.
    const TEXT_COLUMNS = ["nameKo", "nameEn", "year", "program", "location", "status"];
    const PASTE_COLUMNS = ["category", ...TEXT_COLUMNS, "thumb", null, "id", null, "note"];
    const DEFAULT_FIELDS = [
      "STATUS", "YEAR", "LOCATION", "PROGRAM", "NUMBER OF FLOORS", "PROJECT TYPE",
      "BUILDING AREA", "TOTAL FLOOR AREA", "CLIENT", "CONSTRUCTION", "PHOTOGRAPHER", "COWORK",
    ];
    // Overview labels prefilled from the row when a detail page is created.
    const FIELD_FROM_ROW = { STATUS: "status", YEAR: "year", LOCATION: "location", PROGRAM: "program" };

    const $ = (selector) => document.querySelector(selector);
    let data = { version: 1, categories: [], works: [] };
    let projects = [];
    let projectInfo = {};
    let dirty = false;
    let editRevision = 0;
    let saving = null;

    const h = (tag, props = {}, ...children) => {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null || value === false) continue;
        if (key === "class") el.className = value;
        else if (key === "dataset") Object.assign(el.dataset, value);
        else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
        else if (key in el) el[key] = value;
        else el.setAttribute(key, value === true ? "" : value);
      }
      el.append(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
      return el;
    };

    let toastTimer;
    const toast = (message, isError = false) => {
      const el = $("#toast");
      el.textContent = message;
      el.classList.toggle("error", isError);
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), isError ? 6000 : 2600);
    };

    const store = window.FiltStore;
    const { isExternal } = store;
    const cssUrl = (url) => `url("${url.replace(/"/g, "%22")}")`;
    const slug = (s) => String(s || "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    const markDirty = () => { editRevision += 1; dirty = true; $("#dirty").classList.add("show"); schedulePreview(); };
    const setClean = () => { dirty = false; $("#dirty").classList.remove("show"); };

    const newWork = (fields = {}) => ({
      id: "",
      category: data.categories[0]?.id || "",
      nameKo: "",
      nameEn: "",
      year: "",
      program: "",
      location: "",
      status: "",
      thumb: "",
      cardThumb: "",
      mobileShape: "tall",
      link: "",
      projectId: "",
      show: { list: true, gallery: true, mobile: true },
      galleryOrder: null,
      note: "",
      ...fields,
    });

    // ---------- filtering ----------

    const visibleWorks = () => {
      const query = $("#search").value.trim().toLowerCase();
      const category = $("#categoryFilter").value;
      const noteOnly = $("#noteOnly").checked;
      return data.works.filter((work) =>
        (!category || work.category === category) &&
        (!noteOnly || work.note) &&
        (!query || [work.nameKo, work.nameEn, work.location, work.program, work.status, work.id]
          .some((value) => String(value || "").toLowerCase().includes(query))));
    };

    // ---------- thumbnails ----------

    const uploadThumb = async (file) => {
      // Thumbnails follow the PC/MOB rule: saved to both folders, the PC path is stored.
      return (await store.upload("works", "both", file)).PC;
    };

    const popup = $("#thumbPopup");
    const showPopup = async (src, event) => {
      if (!src) return;
      popup.style.backgroundImage = cssUrl(await store.assetUrl(src));
      popup.style.display = "block";
      popup.style.left = `${Math.min(event.clientX + 16, innerWidth - 280)}px`;
      popup.style.top = `${Math.min(event.clientY + 16, innerHeight - 200)}px`;
    };
    const hidePopup = () => { popup.style.display = "none"; };

    // Image placeholder: click or drop a file to upload, ✕ to clear.
    const imageSlot = (src, { upload, clear, resolve, label = "이미지" }) => {
      const box = h("div", {
        class: `thumb ${src ? "filled" : "empty"}`,
        tabindex: 0,
        role: "button",
        "aria-label": `${label} ${src ? "교체" : "업로드"}. Enter 또는 Space로 파일 선택, Shift+F10으로 메뉴 열기`,
        title: src ? `${src}
클릭하거나 파일을 끌어다 놓으면 교체` : "클릭하거나 파일을 끌어다 놓아 업로드",
      });
      if (src) resolve(src).then((url) => { if (url) box.style.backgroundImage = `url("${url.replace(/"/g, "%22")}")`; });
      const run = async (file) => {
        if (!file) return;
        box.classList.add("busy");
        try {
          toast("업로드 중…");
          await upload(file);
          toast("업로드 완료");
        } catch (error) {
          toast(`${file.name}: ${error.message || "업로드하지 못했습니다."}`, true);
        } finally {
          box.classList.remove("busy");
        }
      };
      const pick = () => {
        const picker = h("input", { type: "file", accept: "image/*", onchange: () => run(picker.files[0]) });
        picker.click();
      };
      box.addEventListener("click", (event) => { if (!event.target.closest(".x")) pick(); });
      box.addEventListener("keydown", (event) => {
        if (event.target.closest(".x")) return;
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); pick(); }
      });
      const isFile = (event) => event.dataTransfer?.types.includes("Files");
      box.addEventListener("dragover", (event) => { if (!isFile(event)) return; event.preventDefault(); box.classList.add("drop"); });
      box.addEventListener("dragleave", () => box.classList.remove("drop"));
      box.addEventListener("drop", (event) => {
        if (!isFile(event)) return;
        event.preventDefault();
        event.stopPropagation();
        box.classList.remove("drop");
        run(event.dataTransfer.files[0]);
      });
      if (src) box.append(h("button", {
        type: "button",
        class: "x",
        "aria-label": `${label} 비우기`,
        title: "이미지 빼기",
        onkeydown: (event) => { if (event.key === "Enter" || event.key === " ") event.stopPropagation(); },
        onclick: (event) => { event.stopPropagation(); if (confirm("이미지를 뺄까요?")) clear(); },
      }, "✕"));
      window.FiltRowMenu?.attach?.(box, {
        label,
        items: [
          { text: src ? "이미지 교체" : "이미지 업로드", hint: "파일을 선택합니다", run: pick },
          ...(src ? [{ text: "이미지 비우기", hint: "원본 파일은 삭제하지 않습니다", danger: true, run: () => { if (confirm("이미지를 뺄까요?")) clear(); } }] : []),
        ],
      });
      return box;
    };

    const workLabel = (work) => work.nameKo || work.nameEn || work.id || "새 WORKS 행";
    const COLUMN_LABEL = { nameKo: "한글명", nameEn: "영문명", year: "연도", program: "용도", location: "지역", status: "상태", id: "ID", note: "확인 필요 메모" };

    const thumbCell = (work, key) => {
      const box = imageSlot(work[key], {
        resolve: store.assetUrl,
        label: `${workLabel(work)} · 목록 썸네일`,
        upload: async (file) => { work[key] = await uploadThumb(file); render(); markDirty(); },
        clear: () => { work[key] = ""; render(); markDirty(); },
      });
      box.addEventListener("mousemove", (event) => showPopup(work[key], event));
      box.addEventListener("mouseleave", hidePopup);
      return h("td", { class: "thumb-cell" }, box);
    };

    // ---------- detail page link ----------

    const detailCell = (work) => {
      const info = projectInfo[work.projectId];
      if (!work.projectId || !info) {
        return h("td", { class: "detail" }, h("div", { class: "detail-box" },
          h("button", { title: work.projectId ? `"${work.projectId}" 상세페이지가 없습니다` : "상세페이지 만들기 (있는 ID를 넣으면 연결)", onclick: () => createDetail(work) }, "만들기")));
      }
      return h("td", { class: "detail" }, h("div", { class: "detail-box", title: work.projectId },
        h("span", { class: info.runtime ? "on" : "", title: info.runtime ? "게시용 저장됨" : "임시저장만 있음" }, info.runtime ? "게시" : "임시"),
        h("button", { onclick: () => openDetail(work.projectId) }, "편집"),
        h("span", { title: "PC 이미지 수" }, `${info.images}장`)));
    };

    // Who last changed the row, when, and which columns (written by store.saveWorks).
    const shortDate = (iso) => {
      const date = new Date(iso);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    };
    const editedCell = (edited) => h("td", {
      class: "edited",
      title: edited ? `${edited.by ? `@${edited.by}` : ""} ${new Date(edited.at).toLocaleString("ko-KR")}\n${edited.what}` : "",
    }, edited ? `${edited.by ? `@${edited.by} ` : ""}${shortDate(edited.at)} · ${edited.what}` : "");

    // There is no link column: rows with a detail page open /project?id=… (runtime/works.js); an old
    // Imweb link stays in the data as the fallback until the site turns that on.

    const openDetail = async (id) => {
      if (!(await window.FiltHeader.leave())) return;
      dirty = false;
      const params = new URLSearchParams(location.search);
      params.set("id", id);
      location.href = `project.html?${params}`;
    };

    const createDetail = async (work) => {
      try {
        if (!work.id) work.id = slug(work.nameEn);
        const id = (prompt("상세페이지 ID (영문 소문자·숫자·하이픈)", work.id) || "").trim();
        if (!id) return;
        if (!ID_RE.test(id) || id === "works") throw new Error("ID는 영문 소문자, 숫자, 하이픈만 쓸 수 있습니다. ('works'는 사용 불가)");
        if (projects.some((entry) => entry.id === id)) {
          if (!confirm(`"${id}" 상세페이지가 이미 있습니다. 이 행에 연결할까요?`)) return;
        } else {
          const project = {
            id,
            title: "",
            overview: {
              titleEn: (work.nameEn || "").toUpperCase(),
              subtitle: work.nameKo || "",
              fields: DEFAULT_FIELDS.map((label) => ({ label, value: work[FIELD_FROM_ROW[label]] || "" })),
            },
            descriptionHtml: "",
            gallery: [],
            images: [],
            mobile: { images: [], drawings: { coordinateSrc: "", scaleSrc: "", images: [] } },
          };
          await store.saveProject(id, "draft", project);
        }
        work.projectId = id;
        await saveWorks({ quiet: true });
        openDetail(id);
      } catch (error) {
        toast(error.message, true);
      }
    };

    // ---------- table ----------

    const textInput = (work, key, extra = {}) => h("input", {
      type: "text",
      value: work[key] ?? "",
      dataset: { key },
      "aria-label": extra["aria-label"] || extra.title || `${COLUMN_LABEL[key] || key} · ${workLabel(work)}`,
      oninput: (event) => { work[key] = event.target.value; markDirty(); },
      ...extra,
    });

    // Rows are reordered by dragging their number, within the same category (works while filtered).
    let draggingWork = null;
    const makeDraggable = (tr, work, handle) => {
      handle.classList.add("grip");
      handle.title = "끌어서 순서 변경";
      handle.tabIndex = 0;
      handle.setAttribute("aria-label", `${workLabel(work)} 행 순서 변경. 끌어서 순서를 바꾸고 Shift+F10으로 행 메뉴를 엽니다.`);
      handle.addEventListener("mousedown", () => { tr.draggable = true; });
      handle.addEventListener("mouseup", () => { tr.draggable = false; });
      const after = (event) => { const box = tr.getBoundingClientRect(); return event.clientY > box.top + box.height / 2; };
      const accepts = () => draggingWork && draggingWork.category === work.category;
      const clear = () => tr.classList.remove("drop-before", "drop-after");
      tr.addEventListener("dragstart", (event) => {
        draggingWork = work;
        tr.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", "");
      });
      tr.addEventListener("dragend", () => { draggingWork = null; tr.draggable = false; tr.classList.remove("dragging"); });
      tr.addEventListener("dragover", (event) => {
        if (!accepts()) return;
        event.preventDefault();
        const isAfter = after(event);
        tr.classList.toggle("drop-after", isAfter);
        tr.classList.toggle("drop-before", !isAfter);
      });
      tr.addEventListener("dragleave", clear);
      tr.addEventListener("drop", (event) => {
        if (!accepts()) return;
        event.preventDefault();
        clear();
        const moved = draggingWork;
        draggingWork = null;
        if (moved === work) return;
        data.works.splice(data.works.indexOf(moved), 1);
        data.works.splice(data.works.indexOf(work) + (after(event) ? 1 : 0), 0, moved);
        render();
        markDirty();
      });
    };

    const rowFor = (work, index, visible) => {
      const previous = visible[index - 1];
      const tr = h("tr", {
        class: [work.note ? "has-note" : "", previous && previous.category !== work.category ? "category-start" : ""].join(" "),
        dataset: { id: work.id },
      });
      const num = h("td", { class: "num" }, String(data.works.indexOf(work) + 1));
      makeDraggable(tr, work, num);
      tr.append(
        num,
        h("td", {}, h("select", {
          class: "category",
          "aria-label": `분류 · ${workLabel(work)}`,
          onchange: (event) => { work.category = event.target.value; render(); markDirty(); },
        }, data.categories.map((category) => h("option", { value: category.id, selected: category.id === work.category }, category.label)))),
        ...TEXT_COLUMNS.map((key) => h("td", {}, textInput(work, key))),
        thumbCell(work, "thumb"),
        detailCell(work),
        h("td", { class: "mono" }, textInput(work, "id", {
          onblur: (event) => {
            if (!work.id && work.nameEn) { work.id = slug(work.nameEn); event.target.value = work.id; markDirty(); }
          },
        })),
        editedCell(work.edited),
        h("td", { class: "note" }, textInput(work, "note", {
          placeholder: "",
          oninput: (event) => { work.note = event.target.value; tr.classList.toggle("has-note", Boolean(work.note)); markDirty(); },
        })),
      );
      // 보관 here hides the work from the list page only (show.list); the gallery has its own.
      const label = `"${work.nameKo || work.nameEn || "이 행"}"`;
      const listed = Boolean(work.show?.list);
      const change = () => { render(); markDirty(); };
      tr.classList.toggle("archived", !listed);
      FiltRowMenu.attach(tr, {
        label,
        items: [
          listed
            ? { text: "보관", hint: "목록 페이지에서 빠집니다", run: () => { work.show = { ...work.show, list: false }; change(); } }
            : { text: "보관 해제", hint: "목록 페이지에 다시 나옵니다", run: () => { work.show = { ...work.show, list: true }; change(); } },
          {
            text: "삭제",
            hint: "목록·갤러리 모두에서 지웁니다",
            danger: true,
            run: () => {
              if (!confirm(`${label}을(를) 삭제할까요?`)) return;
              data.works.splice(data.works.indexOf(work), 1);
              change();
            },
          },
        ],
      });
      return tr;
    };

    const render = () => {
      const visible = visibleWorks();
      $("#rows").replaceChildren(...visible.map((work, index) => rowFor(work, index, visible)));
      const notes = data.works.filter((work) => work.note).length;
      const archived = data.works.filter((work) => !work.show?.list).length;
      $("#count").textContent = `${visible.length} / ${data.works.length}행${notes ? ` · 확인 필요 ${notes}` : ""}${archived ? ` · 보관 ${archived}` : ""}`;
    };

    // Enter moves to the same column on the next row, like a spreadsheet.
    $("#rows").addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.isComposing || !event.target.dataset.key) return;
      event.preventDefault();
      const rows = [...$("#rows").children];
      const row = event.target.closest("tr");
      const next = rows[rows.indexOf(row) + (event.shiftKey ? -1 : 1)];
      next?.querySelector(`[data-key="${event.target.dataset.key}"]`)?.focus();
    });

    // Pasting a block copied from Excel/Sheets fills cells to the right and below.
    $("#rows").addEventListener("paste", (event) => {
      const key = event.target.dataset?.key;
      const text = event.clipboardData?.getData("text/plain") || "";
      if (!key || !/[\t\n]/.test(text.trim())) return;
      event.preventDefault();
      const grid = text.replace(/\r/g, "").replace(/\n$/, "").split("\n").map((line) => line.split("\t"));
      const visible = visibleWorks();
      const startRow = visible.findIndex((work) => work.id === event.target.closest("tr").dataset.id);
      const startCol = PASTE_COLUMNS.indexOf(key);
      grid.forEach((cells, r) => {
        let work = visible[startRow + r];
        if (!work) { work = newWork(); data.works.push(work); }
        cells.forEach((value, c) => {
          const column = PASTE_COLUMNS[startCol + c];
          if (!column) return;
          if (column === "category") {
            const match = data.categories.find((category) => [category.id, category.label.toLowerCase()].includes(value.trim().toLowerCase()));
            if (match) work.category = match.id;
          } else work[column] = value.trim();
        });
        if (!work.id && work.nameEn) work.id = slug(work.nameEn);
      });
      render();
      markDirty();
      toast(`${grid.length}행 붙여넣기 완료`);
    });

    // ---------- preview (real runtime/works.js with unsaved data) ----------

    const VIEWPORTS = { desktop: { width: 1440, height: 900 }, mobile: { width: 390, height: 844 } };
    let previewDevice = "desktop";
    let previewUrl = null;
    let previewTimer = null;

    const layoutStage = () => {
      document.body.style.setProperty("--panel-top", `${$("#sheetWrap").getBoundingClientRect().top}px`);
      const stage = $("#stage");
      const size = VIEWPORTS[previewDevice];
      const scale = Math.min(1, (stage.clientWidth - 24) / size.width, previewDevice === "mobile" ? 1 : Infinity);
      const height = previewDevice === "mobile" ? Math.min(size.height, (stage.clientHeight - 24) / scale) : (stage.clientHeight - 24) / scale;
      const inner = $("#stageInner");
      inner.style.width = `${size.width}px`;
      inner.style.height = `${height}px`;
      inner.style.transform = `translateX(-50%) scale(${scale})`;
      $("#previewSize").textContent = `${size.width}px · ${Math.round(scale * 100)}%`;
    };

    let previewToken = 0;
    const renderPreview = async () => {
      if ($("#previewPanel").hidden) return;
      const token = ++previewToken;
      // Uploaded thumbnails are relative paths; give the preview URLs this browser can load.
      const copy = FiltRowMenu.withoutArchived(data);
      await Promise.all(copy.works.map(async (work) => {
        work.thumb = await store.assetUrl(work.thumb);
        work.cardThumb = await store.assetUrl(work.cardThumb);
      }));
      if (token !== previewToken) return;
      const nextUrl = URL.createObjectURL(new Blob([JSON.stringify(copy)], { type: "application/json" }));
      const src = store.runtimeUrl("works.js");
      $("#previewFrame").srcdoc = `<!doctype html><html lang="ko"${FiltStore.designAttrs()}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}</style>${FiltStore.previewHead()}</head><body><div data-filt-works></div><script src="${src}" data-view="list" data-works-src="${nextUrl}" data-list-url="#" data-gallery-url="#"><\/script></body></html>`;
      if (previewUrl) setTimeout(URL.revokeObjectURL.bind(URL, previewUrl), 5000);
      previewUrl = nextUrl;
    };
    const schedulePreview = () => { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 600); };
    document.addEventListener("filt-design", () => schedulePreview());

    const syncPreviewToggle = () => {
      const expanded = !$("#previewPanel").hidden;
      $("#togglePreview").setAttribute("aria-expanded", String(expanded));
      $("#togglePreview").title = expanded ? "미리보기 접기" : "미리보기 펼치기";
    };
    const openPreview = () => {
      $("#previewPanel").hidden = false;
      syncPreviewToggle();
      layoutStage();
      renderPreview();
    };

    $("#togglePreview").addEventListener("click", () => {
      if ($("#previewPanel").hidden) openPreview();
      else { $("#previewPanel").hidden = true; syncPreviewToggle(); }
    });
    $("#closePreview").addEventListener("click", () => { $("#previewPanel").hidden = true; syncPreviewToggle(); });
    syncPreviewToggle();
    // The preview shows the list only; its gallery icon opens the gallery editor.
    $("#previewFrame").addEventListener("load", () => {
      $("#previewFrame").contentDocument?.addEventListener("click", (event) => {
        const button = event.target.closest?.(".list-btn, .gallery-btn");
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        if (button.classList.contains("gallery-btn")) location.href = "works-gallery.html";
      }, true);
    });
    document.querySelectorAll("#previewPanel [data-device]").forEach((button) => button.addEventListener("click", () => {
      previewDevice = button.dataset.device;
      document.querySelectorAll("#previewPanel [data-device]").forEach((other) => other.classList.toggle("active", other === button));
      layoutStage();
    }));
    new ResizeObserver(layoutStage).observe($("#stage"));

    // ---------- load / save ----------

    const loadProjects = async () => {
      projects = await store.listProjects();
      projectInfo = {};
      await Promise.all(projects.map(async (entry) => {
        try {
          const { project } = await store.getProject(entry.id);
          projectInfo[entry.id] = { ...entry, images: (project.images || []).length };
        } catch {
          projectInfo[entry.id] = { ...entry, images: 0 };
        }
      }));
    };

    const saveWorks = ({ quiet = false } = {}) => {
      if (saving) return saving;
      data.works.forEach((work) => { if (!work.id && work.nameEn) work.id = slug(work.nameEn); });
      const missing = data.works.findIndex((work) => !work.id);
      if (missing !== -1) throw new Error(`${missing + 1}번 행에 ID나 영문명을 넣어주세요.`);
      const revision = editRevision;
      const snapshot = JSON.parse(JSON.stringify(data));
      const button = $("#save");
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      saving = (async () => {
        try {
          const result = await store.saveWorks(snapshot);
          // The store stamps the saved snapshot. Merge only that metadata into live rows so edits made
          // while saving stay intact and the next save has the correct comparison point.
          const savedRows = new Map(snapshot.works.map((work) => [work.id, work]));
          data.works.forEach((work) => {
            const saved = savedRows.get(work.id);
            if (saved?.edited) work.edited = saved.edited;
          });
          const clean = editRevision === revision;
          if (clean) setClean();
          render();
          if (!quiet) toast(clean
            ? `저장했습니다: ${result.path} (${result.count}행)\n공개 페이지에는 deploy를 누르면 반영됩니다.`
            : `저장했습니다: ${result.path}\n저장 중 수정한 내용은 아직 미저장입니다. 다시 save를 눌러주세요.`);
          return clean;
        } finally {
          saving = null;
          button.disabled = false;
          button.removeAttribute("aria-busy");
        }
      })();
      return saving;
    };

    $("#save").addEventListener("click", () => saveWorks().catch((error) => toast(error.message, true)));
    window.FiltHeader.guard({
      isDirty: () => dirty,
      save: () => saveWorks().then((clean) => clean, (error) => { toast(error.message || "저장하지 못했습니다.", true); return false; }),
      discard: setClean,
    });
    $("#addRowControl").append(FiltAdd.line("WORKS 행 추가", () => {
      const category = $("#categoryFilter").value || data.categories[0]?.id;
      const work = newWork({ category });
      // Insert after the last row of that category so the list stays grouped.
      const lastIndex = data.works.map((entry) => entry.category).lastIndexOf(category);
      data.works.splice(lastIndex + 1, 0, work);
      $("#search").value = "";
      $("#noteOnly").checked = false;
      render();
      markDirty();
      $(`#rows tr:nth-child(${visibleWorks().indexOf(work) + 1}) [data-key="nameKo"]`)?.focus();
    }));
    ["#search", "#categoryFilter", "#noteOnly"].forEach((selector) => $(selector).addEventListener("input", render));
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveWorks().catch((error) => toast(error.message, true));
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (dirty) { event.preventDefault(); event.returnValue = ""; }
    });

    (async () => {
      try {
        await store.ready();
        store.mountHeader($("#account"));
        [data] = await Promise.all([store.getWorks(), loadProjects()]);
        // Detail pages ported by hand share the row's ID; link those without asking. (projectId is
        // only used by the builder, so this rides along with the next save.)
        data.works.forEach((work) => { if (!work.projectId && projectInfo[work.id]) work.projectId = work.id; });
        $("#categoryFilter").replaceChildren(
          h("option", { value: "" }, "전체 분류"),
          ...data.categories.map((category) => h("option", { value: category.id }, category.label)),
        );
        render();
      } catch (error) {
        toast(error.message, true);
      }
    })();
  })();
  </script>
</body>
</html>
