<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FILT. BUILDER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suit-font@1.0.0/dist/suit.min.css">
  <style>
    :root {
      --line: #d9d9d9;
      --muted: #777;
      --bg: #f4f4f2;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      font: 13px/1.5 "SUIT", system-ui, sans-serif;
      color: #111;
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      padding: 5px 10px;
      border: 1px solid #111;
      border-radius: 0;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #111; color: #fff; }
    button.primary { background: #111; color: #fff; }
    button.primary:hover { background: #333; }
    button.icon { padding: 2px 7px; border-color: var(--line); }
    button.icon:hover { border-color: #111; }
    button.small { padding: 1px 6px; font-size: 11px; border-color: var(--line); }
    button.small:hover { border-color: #111; }
    button.danger:hover { background: var(--danger); border-color: var(--danger); }
    button:disabled { opacity: .4; cursor: default; pointer-events: none; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #111; }
    textarea { resize: vertical; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }

    header.bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #111;
      background: #fff;
    }
    header.bar h1 { margin: 0 10px 0 0; font-size: 15px; letter-spacing: .04em; }
    header.bar select { width: auto; min-width: 180px; }
    .tabs { display: flex; }
    .tabs a { padding: 4px 12px; border: 1px solid #111; color: inherit; text-decoration: none; }
    .tabs a + a { border-left: 0; }
    .tabs a.active { background: #111; color: #fff; }
    .badges { display: flex; gap: 4px; }
    .badge { padding: 1px 6px; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .badge.on { border-color: #111; color: #111; }
    .spacer { flex: 1; }
    .help { color: var(--muted); font-size: 12px; }
    .help:hover { color: #111; }
    .save-group { display: flex; align-items: center; gap: 6px; margin-right: 12px; padding-right: 20px; border-right: 1px solid var(--line); }
    .dirty { color: var(--danger); font-size: 12px; visibility: hidden; }
    .dirty.show { visibility: visible; }

    .layout { display: grid; grid-template-columns: minmax(440px, 560px) 1fr; min-height: 0; }
    .editor { overflow-y: auto; border-right: 1px solid #111; background: #fff; }
    details { border-bottom: 1px solid var(--line); }
    summary {
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      user-select: none;
    }
    summary small { margin-left: 6px; font-weight: 400; color: var(--muted); }
    .section-body { display: grid; gap: 10px; padding: 0 14px 14px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .hint { margin: 0; font-size: 11px; color: var(--muted); }
    .muted { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .pad { padding: 0 6px; }
    .tag { flex: none; margin: 0 6px; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); font-size: 10px; text-decoration: none; white-space: nowrap; }
    .tag.on { border-color: #111; color: #111; }

    /* Sheets: rows of cells split by hairlines; inputs fill their cell without a border of their own. */
    .sheet { border: 1px solid var(--line); background: #fff; }
    .sheet-row { display: grid; align-items: stretch; border-bottom: 1px solid var(--line); }
    .sheet > .sheet-row:last-child { border-bottom: 0; }
    .sheet-row > * + * { border-left: 1px solid var(--line); }
    .sheet-row input[type="text"], .sheet-row input[type="number"], .sheet-row select, .sheet-row textarea {
      min-width: 0;
      border: 0;
      background: transparent;
    }
    .sheet-row input:focus, .sheet-row select:focus, .sheet-row textarea:focus { background: #f6f6f3; }
    .sheet-row textarea { display: block; resize: none; }
    .label { display: flex; align-items: center; padding: 0 10px; background: #fafafa; color: var(--muted); font-size: 11px; }
    .cell { display: flex; align-items: center; min-width: 0; }
    .cell > input, .cell > select, .cell > textarea { flex: 1; }
    .form-row { grid-template-columns: 88px 1fr; }
    .field-row { grid-template-columns: 22px 38% 1fr 26px; }
    .slot-row { grid-template-columns: 22px 64px 64px 1fr 26px; }
    .block-row { grid-template-columns: 22px 1fr 26px; }
    .image-row { grid-template-columns: 22px 88px 1fr 26px; }
    .handle { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; letter-spacing: -3px; cursor: grab; user-select: none; }
    .handle:hover { background: #f6f6f3; color: #111; }
    .dragging { opacity: .4; }
    button.remove { padding: 0; border: 0; background: none; color: var(--muted); }
    button.remove:hover { background: var(--danger); color: #fff; }
    button.link { padding: 2px 5px; border: 0; background: none; color: var(--muted); font-size: 11px; text-decoration: underline; }
    button.link:hover { background: none; color: #111; }
    button.tool { padding: 0 8px; border: 0; background: #fafafa; color: #111; font-size: 11px; }
    button.tool:hover, button.tool.on { background: #BD005E; color: #fff; }
    .add-line { display: flex; }
    .add-line > * + * { border-left: 1px solid var(--line); }
    button.add-row { flex: 1; padding: 7px 10px; border: 0; background: none; color: var(--muted); text-align: left; }
    button.add-row:hover, button.add-row.over { background: #f6f6f3; color: #111; }
    .stack-cell { display: grid; align-content: start; min-width: 0; }
    .stack-cell > * + * { border-top: 1px solid var(--line); }
    .cell-line { display: flex; align-items: stretch; min-width: 0; }
    .cell-line > * + * { border-left: 1px solid var(--line); }
    .cell-line > select, .cell-line > input[type="text"] { flex: 1; }
    .cell-line > select { padding: 5px 3px; font-size: 12px; }
    .cell-line > .muted, .cell-line > .link, .check { display: flex; align-items: center; }
    .check { gap: 3px; padding: 0 6px; font-size: 11px; }
    input.narrow { flex: none !important; width: 58px; }
    .area { display: flex; flex: none; align-items: center; gap: 2px; padding-left: 6px; border-left: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .area input { width: 72px; }

    .thumb-cell { display: grid; grid-template-rows: 1fr auto; min-width: 0; }
    .thumb-cell.off .thumb { opacity: .3; }
    .thumb-actions { display: flex; align-items: center; justify-content: space-between; padding: 0 1px; border-top: 1px solid var(--line); }
    .thumb-actions input { margin: 0 2px; }
    .thumb-actions .link { padding: 1px 2px; }
    button.thumb, .thumb {
      position: relative;
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 0;
      border: 0;
      background: #eee center / contain no-repeat;
    }
    button.thumb:hover { background-color: #ddd; color: inherit; outline: 1px solid #111; outline-offset: -1px; }
    .thumb.broken { background-image: none !important; }
    .thumb.broken::after { content: "이미지 없음"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 10px; }
    .thumb.small { flex: none; width: 52px; min-height: 0; height: 32px; }
    .thumb-label { position: absolute; top: 2px; left: 2px; padding: 0 3px; background: rgba(255,255,255,.85); font-size: 9px; font-weight: 700; }
    .image-row .thumb { min-height: 64px; }
    .block-text { min-height: 64px; overflow: hidden; line-height: 1.7; }

    .calibrator { grid-column: 1 / -1; padding: 8px; border-top: 1px solid var(--line); border-left: 0 !important; background: #fafafa; }
    .calibrate-stage { position: relative; border: 1px solid var(--line); background: #fff; }
    .calibrate-stage img { display: block; width: 100%; height: auto; }
    .calibrate-overlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .dial-cell { padding-left: 4px; }
    .dial { flex: none; width: 64px; height: 64px; cursor: grab; touch-action: none; }
    .dial.off .needle { opacity: .25; }
    /* Image grids (IMG / DWG): device tabs over 2-column cards; drawing cards carry the mobile strip. */
    .gallery-group { display: grid; gap: 8px; margin-bottom: 6px; }
    .group-label { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .04em; }
    .group-label .branch { color: var(--muted); }
    .device-tabs { display: flex; width: 60%; border: 1.5px solid #111; }
    .device-tabs button { flex: 1; padding: 3px 8px; border: 0; background: #fff; color: #111; text-align: left; }
    .device-tabs button.on { background: #111; color: #fff; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #111; border-left: 1px solid #111; }
    .card { position: relative; min-width: 0; border-right: 1px solid #111; border-bottom: 1px solid #111; background: #fff; }
    .card.calibrating { grid-column: 1 / -1; }
    .card-media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; cursor: pointer; }
    .card-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; user-select: none; }
    .card-media.broken::after { content: "이미지 없음"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
    .card-media.over { outline: 2px solid #BD005E; outline-offset: -2px; }
    .card.off .card-media img { opacity: .25; }
    .card.calibrating .card-media { cursor: default; }
    .card-tools { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; }
    .card-corner { position: absolute; top: 6px; right: 6px; display: none; gap: 2px; }
    .card:hover .card-corner { display: flex; }
    button.icon-btn, .card-corner button.remove { width: 22px; height: 22px; padding: 2px; border: 0; background: rgba(255,255,255,.9); color: #111; line-height: 1; }
    button.icon-btn svg { display: block; width: 100%; height: 100%; }
    button.icon-btn:hover { background: #111; color: #fff; }
    button.show-toggle { width: 22px; height: 22px; padding: 0; border: 1.5px solid #111; background: #fff; }
    button.show-toggle.on { background: #111; box-shadow: inset 0 0 0 3px #fff; }
    button.show-toggle:hover { background: #ccc; }
    .card-strip { display: grid; grid-template-columns: 16% 44% 40%; height: 44px; border-top: 1px solid #111; }
    .card-strip > div { position: relative; min-width: 0; overflow: hidden; }
    .card-strip > div + div { border-left: 1px solid #111; }
    .strip-num { position: absolute; top: 2px; right: 3px; display: flex; align-items: center; color: var(--muted); font-size: 9px; }
    .card-strip input { padding: 0; border: 0; background: transparent; font-size: 9px; -moz-appearance: textfield; }
    .card-strip input::-webkit-inner-spin-button, .card-strip input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .card-strip input:focus { background: #f6f6f3; outline: none; }
    .strip-num input { width: 30px; text-align: right; color: #111; }
    .strip-north .dial { position: absolute; left: 3px; bottom: 2px; width: 30px; height: 30px; }
    .strip-scale .strip-bar { position: absolute; left: 4px; bottom: 3px; overflow: visible; }
    button.scale-toggle { position: absolute; top: 2px; left: 3px; padding: 0 3px; border: 0; background: none; color: var(--muted); font-size: 9px; letter-spacing: .04em; }
    button.scale-toggle:hover, button.scale-toggle.on { background: #BD005E; color: #fff; }
    .strip-title input { position: absolute; right: 4px; bottom: 4px; width: calc(100% - 8px); font-size: 11px !important; font-weight: 700; text-align: right; }
    .gallery-group > .add-row { justify-self: center; padding: 6px 10px; font-size: 13px; font-weight: 700; letter-spacing: .03em; color: #111; }
    .legacy { border: 0; }
    .legacy summary { padding: 2px 0; color: var(--muted); font-size: 12px; font-weight: 400; }
    .legacy .sheet { margin-top: 6px; }

    .preview { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
    .preview-bar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
    .preview-bar button.active { background: #111; color: #fff; }
    .preview-bar .size { color: var(--muted); font-size: 12px; }
    .stage { position: relative; overflow: hidden; }
    .stage-inner { position: absolute; top: 12px; left: 50%; transform-origin: top center; box-shadow: 0 0 0 1px #111, 0 6px 24px rgba(0,0,0,.12); background: #fff; }
    .stage iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      max-width: 420px;
      padding: 10px 14px;
      background: #111;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: pre-line;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--danger); }
    .empty { display: grid; place-items: center; height: 100%; color: var(--muted); }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 60vh; }
      .editor { border-right: 0; border-bottom: 1px solid #111; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>FILT. BUILDER</h1>
    <nav class="tabs">
      <a href="works.html">WORKS 목록</a>
      <a href="./" class="active">프로젝트 상세</a>
    </nav>
    <select id="projectSelect" aria-label="프로젝트 선택"></select>
    <button id="newProject">+ 새 프로젝트</button>
    <a class="help" href="https://github.com/filt-office/filt-project-templates-editor/blob/main/docs/BUILDER_GUIDE.md" target="_blank" rel="noopener">도움말</a>
    <div class="badges" title="저장 위치">
      <span class="badge" id="badgeDraft">drafts</span>
      <span class="badge" id="badgeRuntime">runtime</span>
    </div>
    <span class="dirty" id="dirty">● 저장 안 됨</span>
    <span class="spacer"></span>
    <div class="save-group" role="group" aria-label="저장">
      <span class="hint">저장</span>
      <button id="saveDraft" title="Ctrl+S · 나만 보는 초안">임시저장</button>
      <button id="saveRuntime" class="primary" title="게시 대상에 올립니다. 공개 페이지 반영은 '게시…'에서">게시용 저장</button>
    </div>
    <span id="account"></span>
  </header>

  <div class="layout">
    <main class="editor" id="editor">
      <div class="empty">프로젝트를 불러오는 중…</div>
    </main>
    <section class="preview" aria-label="미리보기">
      <div class="preview-bar">
        <button data-device="desktop">PC</button>
        <button data-device="mobile">모바일</button>
        <span class="size" id="previewSize"></span>
        <span class="spacer"></span>
        <button id="reloadPreview">새로고침</button>
      </div>
      <div class="stage" id="stage">
        <div class="stage-inner" id="stageInner"><iframe id="previewFrame" title="프로젝트 미리보기"></iframe></div>
      </div>
    </section>
  </div>
  <input type="file" id="filePicker" accept="image/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="store.js"></script>
  <script>
  (() => {
    "use strict";

    const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
    const VIEWPORTS = { desktop: { width: 1440, height: 900 }, mobile: { width: 390, height: 844 } };
    const DEFAULT_FIELDS = [
      "STATUS", "YEAR", "LOCATION", "PROGRAM", "NUMBER OF FLOORS", "PROJECT TYPE",
      "BUILDING AREA", "TOTAL FLOOR AREA", "CLIENT", "CONSTRUCTION", "PHOTOGRAPHER", "COWORK",
    ];
    // Asset folders, matching the company's PC / MOB convention.
    const PC = "PC";
    const MOB = "MOB";
    const DEVICE_LABEL = { [PC]: "PC", [MOB]: "모바일" };
    const SLOT_KEY = { [PC]: "pc", [MOB]: "mob" };
    const HIDE_KEY = { [PC]: "hidePc", [MOB]: "hideMob" };

    const $ = (selector) => document.querySelector(selector);
    const editor = $("#editor");
    const frame = $("#previewFrame");

    let projects = [];
    let project = null;
    let saved = { draft: false, runtime: false };
    let dirty = false;
    let viewport = new URLSearchParams(location.search).get("device") === "mobile" ? "mobile" : "desktop";
    let previewUrl = null;
    let previewTimer = null;
    let works = null; // runtime/works.json, for the WORKS 분류 field
    let worksCategory = null; // category picked here, written to works.json on the next save

    // ---------- helpers ----------

    const h = (tag, props = {}, ...children) => {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null || value === false) continue;
        if (key === "class") el.className = value;
        else if (key === "dataset") Object.assign(el.dataset, value);
        else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
        else if (key in el && key !== "list") el[key] = value;
        else el.setAttribute(key, value === true ? "" : value);
      }
      el.append(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
      return el;
    };

    let toastTimer;
    const toast = (message, isError = false) => {
      const el = $("#toast");
      el.textContent = message;
      el.classList.toggle("error", isError);
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), isError ? 6000 : 2600);
    };

    const store = window.FiltStore;
    const { isExternal } = store;

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    const titleCase = (value) => String(value || "").toLowerCase().replace(/(^|[\s-])(\S)/g, (_, gap, letter) => gap + letter.toUpperCase());

    const autoGrow = (area) => {
      area.style.height = "auto";
      area.style.height = `${area.scrollHeight + 2}px`;
    };

    const markDirty = () => {
      dirty = true;
      $("#dirty").classList.add("show");
      schedulePreview();
    };

    const setClean = () => {
      dirty = false;
      $("#dirty").classList.remove("show");
    };

    // ---------- data model ----------
    // project.gallery is the builder's source of truth: one slot per image, holding a PC and a
    // MOB version. compile() turns it into what project-template.js reads:
    //   images                 → PC gallery (photos + drawings)
    //   mobile.images          → mobile gallery (photos)
    //   mobile.drawings.images → mobile drawing slider (drawings)

    const newSlot = (fields = {}) => ({
      type: "photo",
      orientation: "landscape",
      alt: "",
      fit: "auto",
      rotation: 0,
      title: "",
      coordinate: true,
      north: null, // degrees clockwise from the drawing's top; null = no generated north arrow
      scale: null, // drawing scale denominator (50 = 1:50); null uses mobile.drawings.scale
      pc: "",
      mob: "",
      hidePc: false,
      hideMob: false,
      ...fields,
    });

    // Builds slots from older JSON that only has images / mobile.* (e.g. Tempin).
    const deriveGallery = (data) => {
      const pcImages = Array.isArray(data.desktop?.images) ? data.desktop.images : (data.images || []);
      const mobileImages = Array.isArray(data.mobile?.images) ? data.mobile.images : null;
      const mobileDrawings = data.mobile?.drawings?.images || [];
      const slots = [];
      const usedMobile = new Set();
      let drawingIndex = 0;
      for (const image of pcImages) {
        const common = { alt: image.alt || "", fit: image.fit || "auto", rotation: Number(image.rotation) || 0, pc: image.src || "" };
        if (image.class === "drawing") {
          const drawing = mobileDrawings[drawingIndex++];
          slots.push(newSlot({
            ...common,
            type: "drawing",
            mob: drawing?.src || "",
            hideMob: !drawing,
            title: drawing?.title || "",
            coordinate: drawing?.coordinate !== false,
            scale: drawing?.scale ?? null,
          }));
        } else {
          const match = mobileImages ? mobileImages.find((candidate) => candidate.src === image.src) : image;
          if (match && mobileImages) usedMobile.add(match);
          slots.push(newSlot({
            ...common,
            orientation: image.class === "portrait" ? "portrait" : "landscape",
            mob: match?.src || "",
            hideMob: !match,
          }));
        }
      }
      mobileDrawings.slice(drawingIndex).forEach((drawing) => slots.push(newSlot({
        type: "drawing",
        mob: drawing.src || "",
        alt: drawing.alt || "",
        title: drawing.title || "",
        coordinate: drawing.coordinate !== false,
        scale: drawing.scale ?? null,
        hidePc: true,
      })));
      (mobileImages || []).filter((image) => !usedMobile.has(image)).forEach((image) => slots.push(newSlot({
        orientation: image.class === "portrait" ? "portrait" : "landscape",
        alt: image.alt || "",
        fit: image.fit || "auto",
        rotation: Number(image.rotation) || 0,
        mob: image.src || "",
        hidePc: true,
      })));
      return slots;
    };

    const showsOn = (slot, device) => !slot[HIDE_KEY[device]] && Boolean(slot[SLOT_KEY[device]]);

    const compile = (source) => {
      const out = JSON.parse(JSON.stringify(source));
      const gallery = out.gallery || [];
      const galleryImage = (slot, src) => ({
        src,
        class: slot.type === "drawing" ? "drawing" : slot.orientation,
        alt: slot.type === "drawing" ? "" : slot.alt || "",
        fit: slot.fit || "auto",
        rotation: Number(slot.rotation) || 0,
      });
      out.images = gallery.filter((slot) => showsOn(slot, PC)).map((slot) => galleryImage(slot, slot.pc));
      if (out.desktop) delete out.desktop.images;
      out.mobile ||= {};
      out.mobile.images = gallery
        .filter((slot) => slot.type === "photo" && showsOn(slot, MOB))
        .map((slot) => galleryImage(slot, slot.mob));
      out.mobile.drawings ||= {};
      out.mobile.drawings.images = gallery
        .filter((slot) => slot.type === "drawing" && showsOn(slot, MOB))
        .map((slot) => ({
          src: slot.mob,
          title: slot.title || "",
          ...(slot.coordinate === false ? { coordinate: false } : {}),
          ...(slot.north != null && slot.north !== "" ? { north: Number(slot.north) } : {}),
          ...(slot.scale > 0 ? { scale: Number(slot.scale) } : {}),
        }));
      out.descriptionHtml = descriptionHtml(out.description || []);
      return out;
    };

    // ---------- description ----------
    // project.description is the builder's source: [{ type: "text", text } | { type: "image", src, caption }].
    // In text, Enter is a line break and a blank line starts a new paragraph. compile() writes the
    // same HTML the hand-written pages used: <br><br> after each paragraph, <figure> for images.

    const descriptionHtml = (blocks) => {
      const parts = blocks.flatMap((block) => {
        if (block.type === "image") {
          if (!block.src) return [];
          const caption = (block.caption || "").trim();
          return [`<figure class="side-figure">\n  <img class="side-single-img" src="${escapeHtml(block.src)}" alt="${escapeHtml(caption)}">\n${caption ? `  <figcaption class="side-caption">${escapeHtml(caption)}</figcaption>\n` : ""}</figure>`];
        }
        return (block.text || "").split(/\n[ \t]*\n/)
          .map((paragraph) => paragraph.split("\n").map((line) => line.trim()).join("\n").trim())
          .filter(Boolean)
          .map((paragraph) => `${escapeHtml(paragraph).replace(/\n/g, "<br>\n")}\n<br><br>`);
      });
      return parts.length ? `<br><br>\n${parts.join("\n")}\n` : "";
    };

    // Reads hand-written descriptionHtml (e.g. Tempin) into blocks.
    const parseDescription = (html) => {
      const template = document.createElement("template");
      template.innerHTML = html || "";
      const blocks = [];
      let text = "";
      const flush = () => {
        const paragraphs = text.split(/\n\s*\n/)
          .map((paragraph) => paragraph.split("\n").map((line) => line.trim()).join("\n").trim())
          .filter(Boolean);
        if (paragraphs.length) blocks.push({ type: "text", text: paragraphs.join("\n\n") });
        text = "";
      };
      template.content.childNodes.forEach((node) => {
        if (node.nodeType === Node.TEXT_NODE) text += node.textContent.replace(/\s+/g, " ");
        else if (node.nodeName === "BR") text += "\n";
        else if (node.nodeType !== Node.ELEMENT_NODE) return;
        else if (node.matches("img, figure") || node.querySelector("img")) {
          flush();
          const img = node.matches("img") ? node : node.querySelector("img");
          const caption = node.querySelector?.("figcaption")?.textContent.replace(/\s+/g, " ").trim() || "";
          blocks.push({ type: "image", src: img?.getAttribute("src") || "", caption });
        } else {
          text += `\n\n${node.textContent.replace(/\s+/g, " ")}\n\n`;
        }
      });
      flush();
      return blocks;
    };

    const ensureShape = (data) => {
      data.overview ||= {};
      data.overview.fields = Array.isArray(data.overview.fields) ? data.overview.fields : [];
      data.mobile ||= {};
      data.mobile.drawings ||= {};
      if (!Array.isArray(data.description)) data.description = parseDescription(data.descriptionHtml);
      if (!Array.isArray(data.gallery)) data.gallery = deriveGallery(data);
      // Angle and scale used to be project-wide defaults; they now live on each drawing.
      const { north, scale } = data.mobile.drawings;
      data.gallery.forEach((slot) => {
        if (slot.type !== "drawing") return;
        if (slot.north == null && north != null && north !== "" && slot.coordinate !== false) slot.north = Number(north);
        if (slot.scale == null && Number(scale) > 0) slot.scale = Number(scale);
      });
      delete data.mobile.drawings.north;
      delete data.mobile.drawings.scale;
      // Drawings carry no alt text; photo alts were once prefilled as "#01 …".
      data.gallery = data.gallery.map((slot) => newSlot({
        ...slot,
        alt: slot.type === "drawing" ? "" : String(slot.alt || "").replace(/^#\s*/, ""),
      }));
      return data;
    };

    const blankProject = (id) => ({
      id,
      title: "",
      overview: {
        titleEn: "",
        subtitle: "",
        fields: DEFAULT_FIELDS.map((label) => ({ label, value: "" })),
      },
      description: [],
      gallery: [],
      mobile: { drawings: { coordinateSrc: "", scaleSrc: "" } },
    });

    // ---------- upload ----------

    const detectKind = (file) => new Promise((resolve) => {
      if (/svg/.test(file.type) || /\.svg$/i.test(file.name)) return resolve({ type: "drawing" });
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        resolve({ type: "photo", orientation: img.naturalHeight > img.naturalWidth ? "portrait" : "landscape" });
        URL.revokeObjectURL(url);
      };
      img.onerror = () => { resolve({ type: "photo", orientation: "landscape" }); URL.revokeObjectURL(url); };
      img.src = url;
    });

    const ensureSaved = async () => {
      if (!saved.draft && !saved.runtime) await saveProject("draft", { quiet: true });
    };

    // device: "both" | PC | MOB. Resolves to { PC?: src, MOB?: src }.
    const upload = async (file, device) => {
      await ensureSaved();
      return store.upload(project.id, device, file);
    };

    // Oversized photos are scaled down in the browser before upload, keeping their proportions.
    // Gallery images fill the screen, so 3840px on the long edge covers a 4K display. Description
    // images show at most 300px wide on PC and full width on phones, so 1400px covers 3x screens.
    const GALLERY_SHRINK = { maxEdge: 3840, quality: 0.92, keepPng: true };
    const DESCRIPTION_SHRINK = { maxWidth: 1400, maxBytes: 1024 * 1024, quality: 0.85 };
    const MB = (bytes) => `${(bytes / 1048576).toFixed(1)}MB`;

    const shrinkImage = async (file, { maxEdge = Infinity, maxWidth = Infinity, maxBytes = Infinity, quality, keepPng = false }) => {
      if (/\.(svg|gif)$/i.test(file.name)) return file;
      const bitmap = await createImageBitmap(file).catch(() => null);
      if (!bitmap) return file;
      const ratio = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height), maxWidth / bitmap.width);
      if (ratio === 1 && file.size <= maxBytes) return file;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * ratio);
      canvas.height = Math.round(bitmap.height * ratio);
      const context = canvas.getContext("2d");
      const png = keepPng && /\.png$/i.test(file.name);
      if (!png) {
        context.fillStyle = "#fff"; // JPG has no transparency; the pages are white behind images
        context.fillRect(0, 0, canvas.width, canvas.height);
      }
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, png ? "image/png" : "image/jpeg", quality));
      if (!blob || blob.size >= file.size) return file;
      return new File([blob], png ? file.name : `${file.name.replace(/\.[^.]+$/, "")}.jpg`, { type: blob.type });
    };

    const uploadMany = async (files, device, onEach, shrink = GALLERY_SHRINK) => {
      // Unsupported files are not filtered out here, so store.upload can say which formats work.
      const list = Array.from(files);
      if (!list.length) return;
      toast(`업로드 중… (${list.length}개)`);
      let done = 0;
      for (const original of list) {
        try {
          const file = await shrinkImage(original, shrink);
          if (file !== original) toast(`${original.name}: ${MB(original.size)} → ${MB(file.size)}로 줄여서 올립니다 (비율 그대로).`);
          else if (file.size > 5 * 1024 * 1024) toast(`${file.name}: ${MB(file.size)} — 용량이 커서 페이지가 느려질 수 있어요.`);
          await onEach(file, await upload(file, device));
          done += 1;
        } catch (error) {
          toast(`${file.name}: ${error.message}`, true);
        }
      }
      if (done) toast(`${done}개 업로드 완료`);
    };

    const pickFile = () => new Promise((resolve) => {
      const picker = $("#filePicker");
      picker.value = "";
      picker.onchange = () => resolve(picker.files[0] || null);
      picker.click();
    });

    // Copies one device's image to the other ("PC와 같게" / "모바일과 같게").
    const copyAcross = async (src, toDevice) => {
      if (!src || isExternal(src)) return src;
      await ensureSaved();
      return store.copyAsset(project.id, src, toDevice);
    };

    const setThumb = async (thumb, src) => {
      thumb.classList.remove("broken");
      thumb.style.backgroundImage = "";
      const url = src ? await store.assetUrl(src) : "";
      if (!url) { thumb.classList.add("broken"); return; }
      thumb.style.backgroundImage = `url("${url.replace(/"/g, "%22")}")`;
      const probe = new Image();
      probe.onerror = () => thumb.classList.add("broken");
      probe.src = url;
    };

    // ---------- form pieces ----------
    // The editor is laid out as sheets: rows of cells split by hairlines, each input filling its
    // cell. How-to text lives in docs/BUILDER_GUIDE.md rather than on screen.

    const section = (title, note, body, open = true) => h("details", { open },
      h("summary", {}, title, note),
      h("div", { class: "section-body" }, body),
    );

    const sheet = (...rows) => h("div", { class: "sheet" }, rows);

    const formRow = (label, ...controls) => h("div", { class: "sheet-row form-row" },
      h("span", { class: "label" }, label),
      h("div", { class: "cell" }, controls));

    const textInput = (getValue, setValue, props = {}) => h("input", {
      type: "text",
      class: props.class,
      placeholder: props.placeholder,
      title: props.title,
      value: getValue() ?? "",
      oninput: (event) => { setValue(event.target.value); markDirty(); },
    });

    const numberValue = (value) => (value === "" ? null : Number(value));

    const numberInput = (getValue, setValue, props = {}) => h("input", {
      type: "number",
      class: props.class,
      min: props.min,
      step: props.step || "any",
      placeholder: props.placeholder,

    const removeButton = (list, index, rerender, label) => h("button", {
      type: "button",
      class: "remove",
      title: "삭제",
      onclick: () => {
        if (!confirm(`${label || "항목"}을(를) 삭제할까요?\n(업로드된 파일은 폴더에 남습니다)`)) return;

    const addButton = (label, onclick) => h("button", { type: "button", class: "add-row", onclick }, label);

    const dragHandle = () => h("span", { class: "handle", title: "끌어서 순서 바꾸기" }, "⋮⋮");

    // Drag-to-reorder: container children carry data-index into list (an array, or a function returning
    // the current one) and are dragged by their handle. axis "x" suits grids: left/right half decides.
    const sortable = (container, list, onChange, { handle = ".handle", axis = "y" } = {}) => {
      const items = () => (typeof list === "function" ? list() : list);
      let dragged = null;
      const release = () => container.querySelectorAll("[draggable=true]").forEach((item) => { item.draggable = false; });
      container.addEventListener("pointerdown", (event) => {
        if (event.target.closest("input, button, .calibrate-overlay")) return;
        const item = event.target.closest(handle)?.closest("[data-index]");
        if (item?.parentElement === container) item.draggable = true;
      });
      container.addEventListener("pointerup", release);
      container.addEventListener("dragstart", (event) => {
        dragged = event.target.closest?.("[data-index]") || null;
        if (!dragged) return;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", "");
        dragged.classList.add("dragging");
      });
      container.addEventListener("dragover", (event) => {
        if (!dragged) return;
        event.preventDefault();
        const over = event.target.closest("[data-index]");
        if (!over || over === dragged || over.parentElement !== container) return;
        const rect = over.getBoundingClientRect();
        const after = axis === "x" ? event.clientX > rect.left + rect.width / 2 : event.clientY > rect.top + rect.height / 2;
        if (after) over.after(dragged);
        else over.before(dragged);
      });
      container.addEventListener("drop", (event) => event.preventDefault());
      container.addEventListener("dragend", () => {
        if (!dragged) return;
        dragged.classList.remove("dragging");
        release();
        dragged = null;
        const current = items();
        const order = [...container.children].map((child) => current[Number(child.dataset.index)]);
        if (order.every((item, index) => item === current[index])) return;
        current.splice(0, current.length, ...order);
        onChange();
      });
    };

    // A thumbnail that replaces its image when clicked.
    const thumbButton = (src, label, title, onclick) => {
      const thumb = h("button", { type: "button", class: "thumb", title, onclick }, label ? h("span", { class: "thumb-label" }, label) : null);
      setThumb(thumb, src);
      return thumb;
    };

    // URL/path input with an upload button; used for the hand-made overlay images (방위표, 축척 바).
    const srcInput = (getValue, setValue, device) => {
      const thumb = h("div", { class: "thumb small" });
      setThumb(thumb, getValue());
      const input = h("input", {
        type: "text",
        class: "mono",
        value: getValue() || "",
        placeholder: "https://… 또는 업로드",
        oninput: () => { setValue(input.value.trim()); setThumb(thumb, input.value.trim()); markDirty(); },
      });
      const button = h("button", {
        type: "button",
        class: "link",
        onclick: async () => {
          const file = await pickFile();
          if (!file) return;
          await uploadMany([file], device, (_, src) => {
            input.value = src[device];
            setValue(src[device]);
            setThumb(thumb, src[device]);
            markDirty();
          });
        },
      }, "업로드");
      return [thumb, input, button];
    };

    const dropButton = (label, onFiles) => {
      const picker = h("input", { type: "file", accept: "image/*", multiple: true, hidden: true, onchange: () => onFiles(picker.files) });
      const zone = h("button", { type: "button", class: "add-row", onclick: () => { picker.value = ""; picker.click(); } }, label);
      zone.addEventListener("dragover", (event) => { event.preventDefault(); zone.classList.add("over"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("over"));
      zone.addEventListener("drop", (event) => { event.preventDefault(); zone.classList.remove("over"); onFiles(event.dataTransfer.files); });
      return [zone, picker];
    };

    // ---------- drawing tools (north dial, scale calibration) ----------
    // Drawings are exported from Illustrator artboards in pt, so at 1:N one metre is 72 / 0.0254 / N
    // viewBox units — the same rule project-template.js uses to draw the mobile scale bar.

    const UNITS_PER_METER = 72 / 0.0254;
    const barLength = (scale) => [200, 100, 50, 20, 10, 5, 2, 1].find((meters) => (meters * UNITS_PER_METER) / scale <= 300) || 1;
    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = (tag, attrs = {}, text) => {
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      if (text !== undefined) el.textContent = text;
      return el;
    };

    // Keeps a drag going when the pointer leaves the element; not every pointer can be captured.
    const capture = (element, event) => {
      try { element.setPointerCapture(event.pointerId); } catch { /* drag still works inside the element */ }
    };

    const viewBoxes = new Map();
    const drawingViewBox = (url) => {
      if (!viewBoxes.has(url)) {
        viewBoxes.set(url, fetch(url)
          .then((response) => (response.ok ? response.text() : ""))
          .then((text) => {
            const box = text.match(/<svg\b[^>]*?\sviewBox\s*=\s*["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/i);
            return box ? { width: Number(box[1]), height: Number(box[2]) } : null;
          })
          .catch(() => null));
      }
      return viewBoxes.get(url);
    };

    // Drag the needle (anywhere on the dial) to point north; the number box stays in sync.
    const compassDial = (getDegrees, setDegrees) => {
      const needle = svg("g", { class: "needle" });
      needle.append(
        svg("rect", { x: "-1.6", y: "-24", width: "3.2", height: "24", fill: "#111" }), // square-ended, like the site
        svg("text", { y: "-29", "text-anchor": "middle", "font-size": "11", "font-weight": "700", fill: "#111" }, "N"),
      );
      const dial = svg("svg", { viewBox: "-42 -42 84 84", class: "dial" });
      dial.append(svg("circle", { r: "24", fill: "#fff", stroke: "#111", "stroke-width": "1" }), needle);
      const draw = () => {
        const degrees = getDegrees();
        dial.classList.toggle("off", degrees == null);
        needle.setAttribute("transform", `rotate(${degrees || 0})`);
      };
      const turn = (event) => {
        const rect = dial.getBoundingClientRect();
        const degrees = Math.round((Math.atan2(event.clientX - rect.left - rect.width / 2, rect.top + rect.height / 2 - event.clientY) * 180) / Math.PI);
        setDegrees((degrees + 360) % 360);
        draw();
      };
      let turning = false;
      dial.addEventListener("pointerdown", (event) => { turning = true; capture(dial, event); turn(event); });
      dial.addEventListener("pointermove", (event) => { if (turning) turn(event); });
      dial.addEventListener("pointerup", () => { turning = false; });
      dial.addEventListener("pointercancel", () => { turning = false; });
      dial.redraw = draw;
      draw();
      return dial;
    };

    // Stretchable scale bar laid over a drawing, like a CAD dynamic block: drag the bar onto a known
    // dimension, then drag its end grip. Stretching keeps the bar's metres fixed and solves for the
    // scale. Returns a function that redraws the bar (e.g. after the scale is typed in).
    const attachCalibrator = (overlay, box, getScale, onScale) => {
      let origin = { x: box.width * 0.08, y: box.height * 0.92 };
      let meters = barLength(getScale());
      const draw = () => {
        const unitsPerMeter = UNITS_PER_METER / getScale();
        const px = overlay.getScreenCTM()?.a || 1; // screen px per drawing unit
        const ticks = [0, meters / 5, (meters * 2) / 5, meters];
        const [a, b, c, d] = ticks.map((value) => origin.x + value * unitsPerMeter);
        const top = origin.y - 10 / px;
        const bottom = origin.y;
        const color = "#BD005E";
        overlay.replaceChildren(
          svg("polyline", { points: `${d} ${bottom} ${d} ${top} ${c} ${top} ${c} ${bottom} ${b} ${bottom} ${b} ${top} ${a} ${top} ${a} ${bottom}`, fill: "none", stroke: color, "stroke-width": 1.5 / px }),
          ...ticks.map((value, index) => svg("text", { x: origin.x + value * unitsPerMeter, y: bottom + 13 / px, "font-size": 11 / px, "text-anchor": "middle", fill: color }, `${Number(value.toFixed(2))}${index === 3 ? "m" : ""}`)),
          svg("rect", { "data-part": "move", x: a, y: top - 6 / px, width: Math.max(d - a, 1), height: 22 / px + 6 / px, fill: "transparent", style: "cursor: move" }),
          svg("rect", { "data-part": "grip", x: d - 6 / px, y: top - 1 / px, width: 12 / px, height: 12 / px, fill: color, style: "cursor: ew-resize" }),
        );
      };
      const toUnits = (event) => {
        const point = overlay.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        return point.matrixTransform(overlay.getScreenCTM().inverse());
      };
      let drag = null;
      overlay.addEventListener("pointerdown", (event) => {
        const part = event.target.getAttribute("data-part");
        if (!part) return;
        event.preventDefault();
        capture(overlay, event);
        drag = { part, start: toUnits(event), origin: { ...origin } };
      });
      overlay.addEventListener("pointermove", (event) => {
        if (!drag) return;
        const at = toUnits(event);
        if (drag.part === "move") {
          origin = { x: drag.origin.x + at.x - drag.start.x, y: drag.origin.y + at.y - drag.start.y };
        } else {
          const length = Math.max(box.width * 0.01, at.x - origin.x);
          onScale(Math.max(1, Math.round(((UNITS_PER_METER * meters) / length) * 10) / 10));
        }
        draw();
      });
      const end = () => {
        if (!drag) return;
        drag = null;
        meters = barLength(getScale());
        draw();
      };
      overlay.addEventListener("pointerup", end);
      overlay.addEventListener("pointercancel", end);
      draw();
      return () => { meters = barLength(getScale()); draw(); };
    };

    // ---------- sections ----------

    const basicSection = () => section("기본 정보", null, sheet(
      formRow("프로젝트 ID", h("input", { type: "text", class: "mono", value: project.id, readOnly: true, title: "아임웹 위젯의 data-project-id" })),
      formRow("탭 제목", textInput(() => project.title, (value) => { project.title = value; }, {
        placeholder: `${project.overview.titleEn || "PROJECT"} | PROJECT INFO`,
      })),
      worksField(),
    ));

    // ---------- WORKS link ----------
    // The category lives in works.json (one row per project, linked by projectId), not in the project JSON.

    const worksRow = (data = works) => data?.works.find((work) => work.projectId === project.id);

    const worksField = () => {
      if (!works) return formRow("WORKS 분류", h("span", { class: "muted" }, "WORKS 목록을 불러오지 못했습니다"));
      const row = worksRow();
      const value = worksCategory || row?.category || "";
      const field = formRow("WORKS 분류",
        h("select", { onchange: (event) => { worksCategory = event.target.value || null; markDirty(); } },
          row ? null : h("option", { value: "" }, "— 선택 —"),
          works.categories.map((category) => h("option", { value: category.id, selected: category.id === value }, category.label))),
        h("a", {
          class: `tag${row ? " on" : ""}`,
          href: "works.html",
          title: row ? `WORKS 목록의 "${row.nameKo || row.nameEn || row.id}" 행과 연결됨` : "저장하면 WORKS 목록에 추가됩니다 (사이트 표시는 꺼진 상태)",
        }, row ? "연결됨" : "미등록"));
      field.id = "worksField";
      return field;
    };

    const newWorksRow = (data) => {
      const field = (label) => project.overview.fields.find((entry) => (entry.label || "").trim().toUpperCase() === label)?.value || "";
      const ids = new Set(data.works.map((work) => work.id));
      let id = project.id;
      for (let n = 2; ids.has(id); n += 1) id = `${project.id}-${n}`;
      return {
        id,
        category: worksCategory,
        nameKo: project.overview.subtitle || "",
        nameEn: titleCase(project.overview.titleEn),
        year: field("YEAR"),
        program: titleCase(field("PROGRAM")),
        location: titleCase(field("LOCATION").split(/[,\n]/)[0].trim()),
        status: titleCase(field("STATUS")),
        thumb: "",
        cardThumb: "",
        mobileShape: "tall",
        link: "",
        projectId: project.id,
        show: { list: false, gallery: false, mobile: false },
        galleryOrder: null,
        note: "상세페이지 빌더에서 추가됨 — 썸네일·링크 입력 후 표시 켜기",
      };
    };

    // Applies the picked category to the latest works.json so edits made in the WORKS tab are kept.
    const syncWorks = async () => {
      if (!worksCategory) return null;
      const latest = await store.getWorks();
      let row = worksRow(latest);
      if (row) {
        row.category = worksCategory;
      } else {
        row = newWorksRow(latest);
        const last = latest.works.map((work) => work.category).lastIndexOf(worksCategory);
        latest.works.splice(last < 0 ? latest.works.length : last + 1, 0, row);
      }
      await store.saveWorks(latest);
      works = latest;
      worksCategory = null;
      return row;
    };

    const overviewSection = () => {
      const list = h("div", { class: "sheet-list" });
      const fields = project.overview.fields;
      const render = () => {
        list.replaceChildren(...fields.map((field, index) => h("div", { class: "sheet-row field-row", dataset: { index } },
          dragHandle(),
          h("input", { type: "text", value: field.label || "", placeholder: "항목", oninput: (event) => { field.label = event.target.value; markDirty(); } }),
          h("div", { class: "cell" },
            h("textarea", {
              rows: String(field.value || "").split("\n").length,
              value: field.value || "",
              placeholder: "내용",
              oninput: (event) => {
                field.value = event.target.value;
                event.target.rows = field.value.split("\n").length;
                markDirty();
              },
            }),
            /AREA/i.test(field.label || "") || field.areaM2 !== undefined
              ? h("label", { class: "area", title: "㎡ 숫자 — 페이지에서 클릭하면 ㎡ ↔ 평 전환" }, "㎡",
                numberInput(() => field.areaM2, (value) => {
                  if (value == null) delete field.areaM2;
                  else field.areaM2 = value;
                }))
              : null),
          removeButton(fields, index, render, field.label),
        )));
      };
      render();
      sortable(list, fields, () => { render(); markDirty(); });
      return section("개요표", null, [
        sheet(
          formRow("영문 제목", textInput(() => project.overview.titleEn, (value) => { project.overview.titleEn = value; })),
          formRow("부제", textInput(() => project.overview.subtitle, (value) => { project.overview.subtitle = value; })),
        ),
        h("div", { class: "sheet" }, list, h("div", { class: "add-line" },
          addButton("+ 항목", () => { fields.push({ label: "", value: "" }); render(); markDirty(); }))),
      ]);
    };

    // ---------- images: IMG (photos) and DWG (drawings) ----------
    // Two card grids over the one gallery list, which is kept as photos then drawings (also the PC
    // gallery order). Each grid shows one device at a time; a drawing card carries the mobile info
    // strip (north, scale, title) edited in place.

    const isDrawing = (slot) => slot.type === "drawing";
    const galleryTab = { photo: PC, drawing: PC };
    const calibrating = new Set();

    const ICONS = {
      rotate: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3.5 3.5 7 7 10.5"/><path d="M3.5 7h8a5 5 0 0 1 0 10H8"/></svg>',
      landscape: '<svg viewBox="0 0 20 20"><rect x="1.5" y="4.5" width="17" height="11" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/><rect x="1.5" y="7" width="17" height="6" fill="currentColor"/></svg>',
      portrait: '<svg viewBox="0 0 20 20"><rect x="4.5" y="1.5" width="11" height="17" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/><rect x="7" y="1.5" width="6" height="17" fill="currentColor"/></svg>',
    };

    const iconButton = (markup, title, onclick) => {
      const button = h("button", { type: "button", class: "icon-btn", title, onclick });
      button.innerHTML = markup;
      return button;
    };

    const deviceTabs = (kind, rerender) => h("div", { class: "device-tabs" }, [PC, MOB].map((device) => h("button", {
      type: "button",
      class: galleryTab[kind] === device ? "on" : undefined,
      onclick: () => { galleryTab[kind] = device; rerender(); },
    }, device === PC ? "PC" : "MOBILE")));

    const showToggle = (slot, device, rerender) => h("button", {
      type: "button",
      class: `show-toggle${slot[HIDE_KEY[device]] ? "" : " on"}`,
      title: `${DEVICE_LABEL[device]}에 표시`,
      onclick: () => { slot[HIDE_KEY[device]] = !slot[HIDE_KEY[device]]; rerender(); markDirty(); },
    });

    // The card's picture for one device: click or drop a file on it to replace that device's image.
    const cardMedia = (slot, device, rerender) => {
      const key = SLOT_KEY[device];
      const media = h("div", { class: "card-media", title: `${DEVICE_LABEL[device]} 이미지 교체 — 클릭 또는 파일을 끌어다 놓기` });
      const img = h("img", { alt: "", draggable: false });
      const turn = Number(slot.rotation) || 0;
      if (turn) img.style.transform = `rotate(${turn}deg)${turn % 180 ? " scale(.625)" : ""}`;
      img.onerror = () => media.classList.add("broken");
      media.append(img);
      store.assetUrl(slot[key]).then((url) => { if (url) img.src = url; else media.classList.add("broken"); });
      const replace = (files) => uploadMany([...files].slice(0, 1), device, (_, src) => { slot[key] = src[device]; rerender(); markDirty(); });
      media.addEventListener("click", async () => {
        if (calibrating.has(slot)) return;
        const file = await pickFile();
        if (file) replace([file]);
      });
      media.addEventListener("dragover", (event) => {
        if (!event.dataTransfer?.types.includes("Files")) return;
        event.preventDefault();
        media.classList.add("over");
      });
      media.addEventListener("dragleave", () => media.classList.remove("over"));
      media.addEventListener("drop", (event) => {
        if (!event.dataTransfer?.files.length) return;
        event.preventDefault();
        event.stopPropagation();
        media.classList.remove("over");
        replace(event.dataTransfer.files);
      });
      return { media, img };
    };

    // Shown on hover: copy the other device's image, delete.
    const cardCorner = (slot, device, rerender) => {
      const other = device === PC ? MOB : PC;
      const key = SLOT_KEY[device];
      const otherKey = SLOT_KEY[other];
      return h("div", { class: "card-corner" },
        h("button", {
          type: "button",
          class: "icon-btn",
          title: `${DEVICE_LABEL[other]} 이미지와 같게`,
          disabled: !slot[otherKey] || slot[otherKey] === slot[key],
          onclick: async () => {
            try {
              slot[key] = await copyAcross(slot[otherKey], device);
              rerender();
              markDirty();
            } catch (error) {
              toast(error.message, true);
            }
          },
        }, "⇆"),
        removeButton(project.gallery, project.gallery.indexOf(slot), rerender, "이미지"));
    };

    const photoCard = (slot, index, rerender) => {
      const device = galleryTab.photo;
      const portrait = slot.orientation === "portrait";
      return h("div", { class: `card${slot[HIDE_KEY[device]] ? " off" : ""}`, dataset: { index } },
        cardMedia(slot, device, rerender).media,
        h("div", { class: "card-tools" },
          showToggle(slot, device, rerender),
          iconButton(ICONS.rotate, `회전 (지금 ${Number(slot.rotation) || 0}°)`, () => { slot.rotation = ((Number(slot.rotation) || 0) + 90) % 360; rerender(); markDirty(); }),
          iconButton(portrait ? ICONS.portrait : ICONS.landscape, portrait ? "세로 사진 (눌러서 가로로)" : "가로 사진 (눌러서 세로로)", () => {
            slot.orientation = portrait ? "landscape" : "portrait";
            rerender();
            markDirty();
          })),
        cardCorner(slot, device, rerender));
    };

    const drawingCard = (slot, index, rerender) => {
      const device = galleryTab.drawing;
      const { media, img } = cardMedia(slot, device, rerender);
      const scaleOf = () => Number(slot.scale) || 0;
      let box = null;
      let redrawCalibrator = null;

      // Scale bar preview at the drawing's size in this card, as it will sit under the mobile slider.
      const bar = svg("svg", { class: "strip-bar" });
      const drawBar = () => {
        bar.replaceChildren();
        const scale = scaleOf();
        const pixelsPerUnit = box ? Math.min(media.clientWidth / box.width, media.clientHeight / box.height) : 0;
        if (!scale || !pixelsPerUnit) return;
        const meters = barLength(scale);
        const pixelsPerMeter = (UNITS_PER_METER / scale) * pixelsPerUnit;
        const height = 16;
        const font = 6;
        const ticks = [0, meters / 5, (meters * 2) / 5, meters];
        const [a, b, c, d] = ticks.map((value) => 3 + value * pixelsPerMeter);
        const bottom = height - font - 2;
        bar.setAttribute("width", d + font * 1.4);
        bar.setAttribute("height", height);
        bar.append(
          svg("polyline", { points: `${d} ${bottom} ${d} 1 ${c} 1 ${c} ${bottom} ${b} ${bottom} ${b} 1 ${a} 1 ${a} ${bottom}`, fill: "none", stroke: "#111", "stroke-width": ".7" }),
          ...ticks.map((value, tick) => svg("text", { x: 3 + value * pixelsPerMeter, y: height - 0.5, "font-size": font, "text-anchor": "middle", fill: "#111" }, `${Number(value.toFixed(2))}${tick === 3 ? "m" : ""}`)),
        );
      };

      let dial;
      const northField = numberInput(() => slot.north, (value) => { slot.north = value; }, { placeholder: "NUM", onInput: () => dial.redraw() });
      dial = compassDial(() => slot.north, (degrees) => { slot.north = degrees; northField.value = degrees; markDirty(); });
      const scaleField = numberInput(() => slot.scale, (value) => { slot.scale = value; }, {
        min: "1",
        placeholder: "NUM",
        onInput: () => { drawBar(); redrawCalibrator?.(); },
      });
      const card = h("div", { class: `card drawing-card${slot[HIDE_KEY[device]] ? " off" : ""}${calibrating.has(slot) ? " calibrating" : ""}`, dataset: { index } },
        media,
        h("div", { class: "card-tools" }, showToggle(slot, device, rerender)),
        cardCorner(slot, device, rerender),
        h("div", { class: "card-strip" },
          h("div", { class: "strip-north", title: "북쪽 방향 — 바늘을 끌거나 각도 입력 (도면 위쪽 기준 시계방향). 비우면 방위표 없음" },
            dial, h("label", { class: "strip-num" }, northField, "°")),
          h("div", { class: "strip-scale" },
            h("button", {
              type: "button",
              class: `scale-toggle${calibrating.has(slot) ? " on" : ""}`,
              title: "도면 위에 축척 바를 띄워, 끝 ■을 좌우로 끌어 축척 맞추기",
              onclick: () => {
                if (calibrating.has(slot)) calibrating.delete(slot);
                else {
                  calibrating.add(slot);
                  galleryTab.drawing = MOB; // the scale is the mobile drawing's
                }
                rerender();
              },
            }, "SCALE"),
            h("label", { class: "strip-num" }, "1 : ", scaleField),
            bar),
          h("div", { class: "strip-title" }, textInput(() => slot.title, (value) => { slot.title = value; }, { placeholder: "TITLE" }))));

      store.assetUrl(slot[SLOT_KEY[device]]).then((url) => (url ? drawingViewBox(url) : null)).then((found) => {
        box = found;
        const ready = () => {
          drawBar();
          if (!box || !calibrating.has(slot)) return;
          const overlay = svg("svg", { viewBox: `0 0 ${box.width} ${box.height}`, class: "calibrate-overlay" });
          media.append(overlay);
          redrawCalibrator = attachCalibrator(overlay, box, () => scaleOf() || 50, (scale) => {
            slot.scale = scale;
            scaleField.value = scale;
            drawBar();
            markDirty();
          });
        };
        if (img.complete && img.naturalWidth) ready();
        else img.addEventListener("load", ready, { once: true });
      });
      return card;
    };

    const imageGroup = (kind, onChange) => {
      const isKind = (slot) => (kind === "drawing") === isDrawing(slot);
      const group = h("div", { class: "gallery-group" });
      const grid = h("div", { class: "card-grid" });
      let items = [];
      // Writes this group's order back into the gallery, keeping photos before drawings.
      const store_ = () => {
        const others = project.gallery.filter((slot) => !isKind(slot));
        project.gallery.splice(0, project.gallery.length, ...(kind === "drawing" ? [...others, ...items] : [...items, ...others]));
      };
      const render = () => {
        items = project.gallery.filter(isKind);
        store_();
        grid.replaceChildren(...items.map((slot, index) => (kind === "drawing" ? drawingCard : photoCard)(slot, index, render)));
        group.replaceChildren(
          h("div", { class: "group-label" }, h("span", { class: "branch" }, kind === "drawing" ? "└" : "├"), kind === "drawing" ? "DWG" : "IMG"),
          deviceTabs(kind, render),
          grid,
          ...dropButton("+ OR DRAG AND DROP", (files) => uploadMany(files, "both", async (file, src) => {
            const detected = await detectKind(file);
            const number = String(items.length + 1).padStart(2, "0");
            project.gallery.push(newSlot(kind === "drawing"
              ? { type: "drawing", pc: src[PC], mob: src[MOB], title: file.name.replace(/\.[^.]+$/, "") }
              : { type: "photo", orientation: detected.orientation || "landscape", pc: src[PC], mob: src[MOB], alt: `${number} ${project.overview.titleEn || project.id}` }));
            render();
            markDirty();
          })),
        );
        onChange();
      };
      sortable(grid, () => items, () => { store_(); render(); markDirty(); }, { handle: ".card-media", axis: "x" });
      render();
      return group;
    };

    // Older pages used hand-made overlay images; they show only when a drawing has no angle / scale.
    const legacyOverlays = () => {
      const drawings = project.mobile.drawings;
      return h("details", { class: "legacy" },
        h("summary", {}, "직접 만든 방위표 · 축척 바 이미지"),
        sheet(
          formRow("방위표", ...srcInput(() => drawings.coordinateSrc, (value) => { drawings.coordinateSrc = value; }, MOB)),
          formRow("축척 바", ...srcInput(() => drawings.scaleSrc, (value) => { drawings.scaleSrc = value; }, MOB)),
        ));
    };

    const gallerySection = () => {
      const countLabel = h("small", {});
      const updateCount = () => {
        const gallery = project.gallery;
        countLabel.textContent = `${gallery.length}개 · PC ${gallery.filter((slot) => showsOn(slot, PC)).length} / 모바일 ${gallery.filter((slot) => showsOn(slot, MOB)).length}`;
      };
      return section("이미지", countLabel, [imageGroup("photo", updateCount), imageGroup("drawing", updateCount), legacyOverlays()]);
    };

    // Description images are shared by PC and mobile, so they are stored once in PC/.
    const uploadDescriptionImage = async (onDone) => {
      const file = await pickFile();
      if (!file) return;
      await uploadMany([file], PC, (_, src) => onDone(src[PC]), DESCRIPTION_SHRINK);
    };

    const descriptionSection = () => {
      const blocks = project.description;
      const list = h("div", { class: "sheet-list" });
      const textBlock = (block, index) => {
        const area = h("textarea", {
          class: "block-text",
          value: block.text || "",
          placeholder: "본문",
          oninput: () => { block.text = area.value; autoGrow(area); markDirty(); },
        });
        requestAnimationFrame(() => autoGrow(area));
        return h("div", { class: "sheet-row block-row", dataset: { index } }, dragHandle(), area, removeButton(blocks, index, render, "글"));
      };
      const imageBlock = (block, index) => h("div", { class: "sheet-row image-row", dataset: { index } },
        dragHandle(),
        thumbButton(block.src, null, "이미지 교체", () => uploadDescriptionImage((src) => { block.src = src; render(); markDirty(); })),
        textInput(() => block.caption, (value) => { block.caption = value; }, { placeholder: "캡션" }),
        removeButton(blocks, index, render, "이미지"));
      const render = () => list.replaceChildren(...blocks.map((block, index) => (block.type === "image" ? imageBlock(block, index) : textBlock(block, index))));
      const add = (block) => {
        blocks.push(block);
        render();
        markDirty();
        list.lastElementChild?.querySelector("textarea, input[type=text]")?.focus();
      };
      render();
      sortable(list, blocks, () => { render(); markDirty(); });
      return section("설명", null, h("div", { class: "sheet" }, list, h("div", { class: "add-line" },
        addButton("+ 글", () => add({ type: "text", text: "" })),
        addButton("+ 이미지", () => uploadDescriptionImage((src) => add({ type: "image", src, caption: "" }))))));
    };

    const jsonSection = () => {
      const area = h("textarea", { class: "mono", rows: 14, spellcheck: false });
      const details = section("JSON", null, [
        area,
        h("div", { class: "row" },
          h("button", { type: "button", onclick: () => { area.value = JSON.stringify(compile(project), null, 2); } }, "현재 값 불러오기"),
          h("button", {
            type: "button",
            onclick: () => {
              try {
                const next = JSON.parse(area.value);
                next.id = project.id;
                project = ensureShape(next);
                renderEditor();
                markDirty();
                toast("JSON을 적용했습니다.");
              } catch (error) {
                toast(`JSON 오류: ${error.message}`, true);
              }
            },
          }, "적용")),
      ], false);
      details.addEventListener("toggle", () => { if (details.open) area.value = JSON.stringify(compile(project), null, 2); });
      return details;
    };

    const renderEditor = () => {
      editor.replaceChildren(
        basicSection(),
        overviewSection(),
        gallerySection(),
        descriptionSection(),
        jsonSection(),
      );
      updateBadges();
      schedulePreview(0);
    };

    // ---------- preview ----------

    const layoutStage = () => {
      const stage = $("#stage");
      const inner = $("#stageInner");
      const size = VIEWPORTS[viewport];
      const availableWidth = stage.clientWidth - 24;
      const availableHeight = stage.clientHeight - 24;
      const scale = Math.min(1, availableWidth / size.width);
      const height = viewport === "mobile" ? Math.min(size.height, availableHeight / scale) : availableHeight / scale;
      inner.style.width = `${size.width}px`;
      inner.style.height = `${height}px`;
      inner.style.transform = `translateX(-50%) scale(${scale})`;
      $("#previewSize").textContent = `${size.width}px · ${Math.round(scale * 100)}%`;
      document.querySelectorAll("[data-device]").forEach((button) => button.classList.toggle("active", button.dataset.device === viewport));
    };

    // Uploaded images are relative paths; swap them for URLs this browser can load (blob: on GitHub Pages).
    const resolveAssets = async (out) => {
      const resolve = (src) => store.assetUrl(src);
      const fix = async (list) => Promise.all((list || []).map(async (item) => { item.src = await resolve(item.src); }));
      await Promise.all([fix(out.images), fix(out.mobile?.images), fix(out.mobile?.drawings?.images)]);
      const drawings = out.mobile?.drawings;
      if (drawings) {
        drawings.coordinateSrc = await resolve(drawings.coordinateSrc);
        drawings.scaleSrc = await resolve(drawings.scaleSrc);
      }
      const srcs = [...(out.descriptionHtml || "").matchAll(/src="([^"]+)"/g)].map((match) => match[1]).filter((src) => !isExternal(src));
      for (const src of new Set(srcs)) out.descriptionHtml = out.descriptionHtml.split(`src="${src}"`).join(`src="${await resolve(src)}"`);
      return out;
    };

    let previewToken = 0;
    const renderPreview = async () => {
      if (!project) return;
      const token = ++previewToken;
      const data = await resolveAssets(compile(project));
      if (token !== previewToken) return;
      const nextUrl = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      const templateSrc = store.runtimeUrl("project-template.js");
      frame.srcdoc = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}</style></head><body><div data-filt-project="preview"></div><script src="${templateSrc}" data-project-id="preview" data-project-src="${nextUrl}"><\/script></body></html>`;
      if (previewUrl) setTimeout(URL.revokeObjectURL.bind(URL, previewUrl), 5000);
      previewUrl = nextUrl;
    };

    const schedulePreview = (delay = 500) => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(renderPreview, delay);
    };

    document.querySelectorAll("[data-device]").forEach((button) => button.addEventListener("click", () => {
      viewport = button.dataset.device;
      layoutStage();
    }));
    $("#reloadPreview").addEventListener("click", renderPreview);
    new ResizeObserver(layoutStage).observe($("#stage"));

    // ---------- load / save ----------

    const updateBadges = () => {
      $("#badgeDraft").classList.toggle("on", saved.draft);
      $("#badgeRuntime").classList.toggle("on", saved.runtime);
    };

    const refreshList = async (selectId) => {
      projects = await store.listProjects();
      const selectEl = $("#projectSelect");
      selectEl.replaceChildren(...projects.map((entry) => h("option", { value: entry.id, selected: entry.id === selectId },
        `${entry.id}${entry.runtime ? "" : " (draft)"}`)));
      const current = projects.find((entry) => entry.id === selectId);
      if (current) saved = { draft: current.draft, runtime: current.runtime };
      updateBadges();
    };

    const confirmDiscard = () => !dirty || confirm("저장하지 않은 변경 사항이 있습니다. 버리고 이동할까요?");

    const setUrl = (id) => {
      const params = new URLSearchParams(location.search);
      params.set("id", id);
      history.replaceState(null, "", `?${params}`);
    };

    const loadProject = async (id) => {
      const { project: data } = await store.getProject(id);
      project = ensureShape(data);
      project.id = id;
      worksCategory = null;
      await refreshList(id);
      setUrl(id);
      renderEditor();
      setClean();
    };

    const saveProject = async (target, { quiet = false } = {}) => {
      if (!project) return;
      if (target === "runtime" && !confirm(
        "게시용으로 저장할까요?\n\n다음에 '게시'를 누르면 공개 페이지에 반영됩니다.",
      )) return;
      const result = await store.saveProject(project.id, target, compile(project));
      const row = await syncWorks();
      await refreshList(project.id);
      setClean();
      if (row) $("#worksField")?.replaceWith(worksField());
      const category = row && works.categories.find((entry) => entry.id === row.category)?.label;
      if (!quiet || row) toast(`저장했습니다: ${result.path}${row ? `\nWORKS 목록 반영: ${category}` : ""}`);
    };

    const guarded = (fn) => async (...args) => {
      try { await fn(...args); } catch (error) { toast(error.message, true); }
    };

    $("#saveDraft").addEventListener("click", guarded(() => saveProject("draft")));
    $("#saveRuntime").addEventListener("click", guarded(() => saveProject("runtime")));
    $("#projectSelect").addEventListener("change", guarded(async (event) => {
      if (!confirmDiscard()) { event.target.value = project?.id || ""; return; }
      await loadProject(event.target.value);
    }));
    $("#newProject").addEventListener("click", guarded(async () => {
      if (!confirmDiscard()) return;
      const id = (prompt("새 프로젝트 ID (영문 소문자, 숫자, 하이픈 — 예: seongsu-house)") || "").trim().toLowerCase();
      if (!id) return;
      if (!ID_RE.test(id) || id === "works") throw new Error("ID는 영문 소문자, 숫자, 하이픈만 쓸 수 있습니다. ('works'는 사용 불가)");
      if (projects.some((entry) => entry.id === id)) throw new Error(`"${id}"는 이미 있습니다.`);
      project = ensureShape(blankProject(id));
      worksCategory = null;
      saved = { draft: false, runtime: false };
      await saveProject("draft", { quiet: true });
      setUrl(id);
      renderEditor();
      toast(`"${id}" 프로젝트를 drafts에 만들었습니다.`);
    }));

    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        guarded(() => saveProject("draft"))();
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (dirty) { event.preventDefault(); event.returnValue = ""; }
    });

    guarded(async () => {
      layoutStage();
      await store.ready();
      store.mountHeader($("#account"));
      works = await store.getWorks().catch(() => null);
      await refreshList();
      const wanted = new URLSearchParams(location.search).get("id");
      const first = projects.find((entry) => entry.id === wanted) || projects[0];
      if (first) await loadProject(first.id);
      else editor.replaceChildren(h("div", { class: "empty" }, "프로젝트가 없습니다. '+ 새 프로젝트'로 시작하세요."));
    })();
  })();
  </script>
</body>
</html>
