<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FILT. BUILDER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suit-font@1.0.0/dist/suit.min.css">
  <style>
    :root {
      --line: #d9d9d9;
      --muted: #777;
      --bg: #f4f4f2;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      font: 13px/1.5 "SUIT", system-ui, sans-serif;
      color: #111;
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      padding: 5px 10px;
      border: 1px solid #111;
      border-radius: 0;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #111; color: #fff; }
    button.primary { background: #111; color: #fff; }
    button.primary:hover { background: #333; }
    button.icon { padding: 2px 7px; border-color: var(--line); }
    button.icon:hover { border-color: #111; }
    button.small { padding: 1px 6px; font-size: 11px; border-color: var(--line); }
    button.small:hover { border-color: #111; }
    button.danger:hover { background: var(--danger); border-color: var(--danger); }
    button:disabled { opacity: .4; cursor: default; pointer-events: none; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #111; }
    textarea { resize: vertical; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }

    header.bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #111;
      background: #fff;
    }
    header.bar h1 { margin: 0 10px 0 0; font-size: 15px; letter-spacing: .04em; }
    header.bar select { width: auto; min-width: 180px; }
    .tabs { display: flex; }
    .tabs a { padding: 4px 12px; border: 1px solid #111; color: inherit; text-decoration: none; }
    .tabs a + a { border-left: 0; }
    .tabs a.active { background: #111; color: #fff; }
    .badges { display: flex; gap: 4px; }
    .badge { padding: 1px 6px; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .badge.on { border-color: #111; color: #111; }
    .spacer { flex: 1; }
    .save-group { display: flex; align-items: center; gap: 6px; margin-right: 12px; padding-right: 20px; border-right: 1px solid var(--line); }
    .dirty { color: var(--danger); font-size: 12px; visibility: hidden; }
    .dirty.show { visibility: visible; }

    .layout { display: grid; grid-template-columns: minmax(400px, 480px) 1fr; min-height: 0; }
    .editor { overflow-y: auto; border-right: 1px solid #111; background: #fff; }
    details { border-bottom: 1px solid var(--line); }
    summary {
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      user-select: none;
    }
    summary small { margin-left: 6px; font-weight: 400; color: var(--muted); }
    .section-body details { border: 0; }
    .section-body summary { padding: 2px 0; font-weight: 400; }
    .section-body { display: grid; gap: 10px; padding: 0 14px 14px; }
    .stack { display: grid; gap: 10px; }
    .field { display: grid; gap: 3px; }
    .field > span { font-size: 11px; color: var(--muted); }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > * { min-width: 0; }
    .grow { flex: 1; }
    .hint { margin: 0; font-size: 11px; color: var(--muted); }
    .row > .hint { flex: none; white-space: nowrap; }

    .item {
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      background: #fafafa;
    }
    .item-head { display: flex; align-items: center; gap: 4px; }
    .item-head .index { width: 30px; color: var(--muted); font-size: 11px; }
    .item-head .title { flex: 1; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .field-item { grid-template-columns: auto 1fr 1.4fr auto; align-items: start; }
    .block-item { grid-template-columns: auto 1fr auto; align-items: start; }
    .handle { padding: 5px 2px; color: var(--muted); letter-spacing: -3px; cursor: grab; user-select: none; }
    .handle:hover { color: #111; }
    .dragging { opacity: .4; }
    .three { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 5px; }
    input.scale { width: 64px; }
    .compass { position: relative; flex: none; width: 26px; height: 26px; border: 1px solid #111; border-radius: 50%; }
    .compass::after { content: ""; position: absolute; left: calc(50% - 1px); top: 2px; width: 2px; height: 10px; background: #111; transform-origin: 50% 100%; transform: rotate(var(--deg, 0deg)); }
    .compass.off { opacity: .25; }

    .devices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .device {
      display: grid;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .device.off .thumb, .device.off .path { opacity: .35; }
    .device-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; }
    .device-head label { display: flex; align-items: center; gap: 3px; font-weight: 400; }
    .device-actions { display: flex; flex-wrap: wrap; gap: 3px; }
    .path { overflow: hidden; font-size: 10px; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .thumb {
      position: relative;
      height: 96px;
      border: 1px solid var(--line);
      background: #eee center / contain no-repeat;
    }
    .thumb.broken { background-image: none !important; }
    .thumb.broken::after { content: "이미지 없음"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
    .thumb.small { width: 64px; height: 40px; flex: none; }
    .tag { padding: 0 5px; border: 1px solid #111; font-size: 10px; }

    .dropzone {
      display: grid;
      place-items: center;
      min-height: 64px;
      padding: 10px;
      border: 1px dashed #999;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
    }
    .dropzone.over { border-color: #111; color: #111; background: #f0f0f0; }
    .block-text { min-height: 90px; resize: none; overflow: hidden; line-height: 1.7; }

    .preview { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
    .preview-bar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
    .preview-bar button.active { background: #111; color: #fff; }
    .preview-bar .size { color: var(--muted); font-size: 12px; }
    .stage { position: relative; overflow: hidden; }
    .stage-inner { position: absolute; top: 12px; left: 50%; transform-origin: top center; box-shadow: 0 0 0 1px #111, 0 6px 24px rgba(0,0,0,.12); background: #fff; }
    .stage iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      max-width: 420px;
      padding: 10px 14px;
      background: #111;
      color: #fff;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: pre-line;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { background: var(--danger); }
    .empty { display: grid; place-items: center; height: 100%; color: var(--muted); }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 60vh; }
      .editor { border-right: 0; border-bottom: 1px solid #111; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>FILT. BUILDER</h1>
    <nav class="tabs">
      <a href="works.html">WORKS 목록</a>
      <a href="./" class="active">프로젝트 상세</a>
    </nav>
    <select id="projectSelect" aria-label="프로젝트 선택"></select>
    <button id="newProject">+ 새 프로젝트</button>
    <div class="badges" title="저장 위치">
      <span class="badge" id="badgeDraft">drafts</span>
      <span class="badge" id="badgeRuntime">runtime</span>
    </div>
    <span class="dirty" id="dirty">● 저장 안 됨</span>
    <span class="spacer"></span>
    <div class="save-group" role="group" aria-label="저장">
      <span class="hint">저장</span>
      <button id="saveDraft" title="Ctrl+S · 나만 보는 초안">임시저장</button>
      <button id="saveRuntime" class="primary" title="게시 대상에 올립니다. 공개 페이지 반영은 '게시…'에서">게시용 저장</button>
    </div>
    <span id="account"></span>
  </header>

  <div class="layout">
    <main class="editor" id="editor">
      <div class="empty">프로젝트를 불러오는 중…</div>
    </main>
    <section class="preview" aria-label="미리보기">
      <div class="preview-bar">
        <button data-device="desktop">PC</button>
        <button data-device="mobile">모바일</button>
        <span class="size" id="previewSize"></span>
        <span class="spacer"></span>
        <button id="reloadPreview">새로고침</button>
      </div>
      <div class="stage" id="stage">
        <div class="stage-inner" id="stageInner"><iframe id="previewFrame" title="프로젝트 미리보기"></iframe></div>
      </div>
    </section>
  </div>
  <input type="file" id="filePicker" accept="image/*" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="store.js"></script>
  <script>
  (() => {
    "use strict";

    const ID_RE = /^[a-z0-9][a-z0-9-]{0,63}$/;
    const VIEWPORTS = { desktop: { width: 1440, height: 900 }, mobile: { width: 390, height: 844 } };
    const KINDS = [["photo:landscape", "사진 · 가로"], ["photo:portrait", "사진 · 세로"], ["drawing", "도면"]];
    const FITS = ["auto", "contain", "cover"];
    const ROTATIONS = [0, 90, 180, 270];
    const DEFAULT_FIELDS = [
      "STATUS", "YEAR", "LOCATION", "PROGRAM", "NUMBER OF FLOORS", "PROJECT TYPE",
      "BUILDING AREA", "TOTAL FLOOR AREA", "CLIENT", "CONSTRUCTION", "PHOTOGRAPHER", "COWORK",
    ];
    // Asset folders, matching the company's PC / MOB convention.
    const PC = "PC";
    const MOB = "MOB";
    const DEVICE_LABEL = { [PC]: "PC", [MOB]: "모바일" };
    const SLOT_KEY = { [PC]: "pc", [MOB]: "mob" };
    const HIDE_KEY = { [PC]: "hidePc", [MOB]: "hideMob" };

    const $ = (selector) => document.querySelector(selector);
    const editor = $("#editor");
    const frame = $("#previewFrame");

    let projects = [];
    let project = null;
    let saved = { draft: false, runtime: false };
    let dirty = false;
    let viewport = new URLSearchParams(location.search).get("device") === "mobile" ? "mobile" : "desktop";
    let previewUrl = null;
    let previewTimer = null;
    let works = null; // runtime/works.json, for the WORKS 분류 field
    let worksCategory = null; // category picked here, written to works.json on the next save

    // ---------- helpers ----------

    const h = (tag, props = {}, ...children) => {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null || value === false) continue;
        if (key === "class") el.className = value;
        else if (key === "dataset") Object.assign(el.dataset, value);
        else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
        else if (key in el && key !== "list") el[key] = value;
        else el.setAttribute(key, value === true ? "" : value);
      }
      el.append(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
      return el;
    };

    let toastTimer;
    const toast = (message, isError = false) => {
      const el = $("#toast");
      el.textContent = message;
      el.classList.toggle("error", isError);
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), isError ? 6000 : 2600);
    };

    const store = window.FiltStore;
    const { isExternal } = store;

    const move = (list, index, delta) => {
      const target = index + delta;
      if (target < 0 || target >= list.length) return false;
      [list[index], list[target]] = [list[target], list[index]];
      return true;
    };

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    const titleCase = (value) => String(value || "").toLowerCase().replace(/(^|[\s-])(\S)/g, (_, gap, letter) => gap + letter.toUpperCase());

    const autoGrow = (area) => {
      area.style.height = "auto";
      area.style.height = `${area.scrollHeight + 2}px`;
    };

    const markDirty = () => {
      dirty = true;
      $("#dirty").classList.add("show");
      schedulePreview();
    };

    const setClean = () => {
      dirty = false;
      $("#dirty").classList.remove("show");
    };

    // ---------- data model ----------
    // project.gallery is the builder's source of truth: one slot per image, holding a PC and a
    // MOB version. compile() turns it into what project-template.js reads:
    //   images                 → PC gallery (photos + drawings)
    //   mobile.images          → mobile gallery (photos)
    //   mobile.drawings.images → mobile drawing slider (drawings)

    const newSlot = (fields = {}) => ({
      type: "photo",
      orientation: "landscape",
      alt: "",
      fit: "auto",
      rotation: 0,
      title: "",
      coordinate: true,
      scale: null, // drawing scale denominator (50 = 1:50); null uses mobile.drawings.scale
      pc: "",
      mob: "",
      hidePc: false,
      hideMob: false,
      ...fields,
    });

    // Builds slots from older JSON that only has images / mobile.* (e.g. Tempin).
    const deriveGallery = (data) => {
      const pcImages = Array.isArray(data.desktop?.images) ? data.desktop.images : (data.images || []);
      const mobileImages = Array.isArray(data.mobile?.images) ? data.mobile.images : null;
      const mobileDrawings = data.mobile?.drawings?.images || [];
      const slots = [];
      const usedMobile = new Set();
      let drawingIndex = 0;
      for (const image of pcImages) {
        const common = { alt: image.alt || "", fit: image.fit || "auto", rotation: Number(image.rotation) || 0, pc: image.src || "" };
        if (image.class === "drawing") {
          const drawing = mobileDrawings[drawingIndex++];
          slots.push(newSlot({
            ...common,
            type: "drawing",
            mob: drawing?.src || "",
            hideMob: !drawing,
            title: drawing?.title || "",
            coordinate: drawing?.coordinate !== false,
            scale: drawing?.scale ?? null,
          }));
        } else {
          const match = mobileImages ? mobileImages.find((candidate) => candidate.src === image.src) : image;
          if (match && mobileImages) usedMobile.add(match);
          slots.push(newSlot({
            ...common,
            orientation: image.class === "portrait" ? "portrait" : "landscape",
            mob: match?.src || "",
            hideMob: !match,
          }));
        }
      }
      mobileDrawings.slice(drawingIndex).forEach((drawing) => slots.push(newSlot({
        type: "drawing",
        mob: drawing.src || "",
        alt: drawing.alt || "",
        title: drawing.title || "",
        coordinate: drawing.coordinate !== false,
        scale: drawing.scale ?? null,
        hidePc: true,
      })));
      (mobileImages || []).filter((image) => !usedMobile.has(image)).forEach((image) => slots.push(newSlot({
        orientation: image.class === "portrait" ? "portrait" : "landscape",
        alt: image.alt || "",
        fit: image.fit || "auto",
        rotation: Number(image.rotation) || 0,
        mob: image.src || "",
        hidePc: true,
      })));
      return slots;
    };

    const showsOn = (slot, device) => !slot[HIDE_KEY[device]] && Boolean(slot[SLOT_KEY[device]]);

    const compile = (source) => {
      const out = JSON.parse(JSON.stringify(source));
      const gallery = out.gallery || [];
      const galleryImage = (slot, src) => ({
        src,
        class: slot.type === "drawing" ? "drawing" : slot.orientation,
        alt: slot.alt || "",
        fit: slot.fit || "auto",
        rotation: Number(slot.rotation) || 0,
      });
      out.images = gallery.filter((slot) => showsOn(slot, PC)).map((slot) => galleryImage(slot, slot.pc));
      if (out.desktop) delete out.desktop.images;
      out.mobile ||= {};
      out.mobile.images = gallery
        .filter((slot) => slot.type === "photo" && showsOn(slot, MOB))
        .map((slot) => galleryImage(slot, slot.mob));
      out.mobile.drawings ||= {};
      out.mobile.drawings.images = gallery
        .filter((slot) => slot.type === "drawing" && showsOn(slot, MOB))
        .map((slot) => ({
          src: slot.mob,
          title: slot.title || "",
          alt: slot.alt || slot.title || "",
          ...(slot.coordinate === false ? { coordinate: false } : {}),
          ...(slot.scale > 0 ? { scale: Number(slot.scale) } : {}),
        }));
      out.descriptionHtml = descriptionHtml(out.description || []);
      return out;
    };

    // ---------- description ----------
    // project.description is the builder's source: [{ type: "text", text } | { type: "image", src, caption }].
    // In text, Enter is a line break and a blank line starts a new paragraph. compile() writes the
    // same HTML the hand-written pages used: <br><br> after each paragraph, <figure> for images.

    const descriptionHtml = (blocks) => {
      const parts = blocks.flatMap((block) => {
        if (block.type === "image") {
          if (!block.src) return [];
          const caption = (block.caption || "").trim();
          return [`<figure class="side-figure">\n  <img class="side-single-img" src="${escapeHtml(block.src)}" alt="${escapeHtml(caption)}">\n${caption ? `  <figcaption class="side-caption">${escapeHtml(caption)}</figcaption>\n` : ""}</figure>`];
        }
        return (block.text || "").split(/\n[ \t]*\n/)
          .map((paragraph) => paragraph.split("\n").map((line) => line.trim()).join("\n").trim())
          .filter(Boolean)
          .map((paragraph) => `${escapeHtml(paragraph).replace(/\n/g, "<br>\n")}\n<br><br>`);
      });
      return parts.length ? `<br><br>\n${parts.join("\n")}\n` : "";
    };

    // Reads hand-written descriptionHtml (e.g. Tempin) into blocks.
    const parseDescription = (html) => {
      const template = document.createElement("template");
      template.innerHTML = html || "";
      const blocks = [];
      let text = "";
      const flush = () => {
        const paragraphs = text.split(/\n\s*\n/)
          .map((paragraph) => paragraph.split("\n").map((line) => line.trim()).join("\n").trim())
          .filter(Boolean);
        if (paragraphs.length) blocks.push({ type: "text", text: paragraphs.join("\n\n") });
        text = "";
      };
      template.content.childNodes.forEach((node) => {
        if (node.nodeType === Node.TEXT_NODE) text += node.textContent.replace(/\s+/g, " ");
        else if (node.nodeName === "BR") text += "\n";
        else if (node.nodeType !== Node.ELEMENT_NODE) return;
        else if (node.matches("img, figure") || node.querySelector("img")) {
          flush();
          const img = node.matches("img") ? node : node.querySelector("img");
          const caption = node.querySelector?.("figcaption")?.textContent.replace(/\s+/g, " ").trim() || "";
          blocks.push({ type: "image", src: img?.getAttribute("src") || "", caption });
        } else {
          text += `\n\n${node.textContent.replace(/\s+/g, " ")}\n\n`;
        }
      });
      flush();
      return blocks;
    };

    const ensureShape = (data) => {
      data.overview ||= {};
      data.overview.fields = Array.isArray(data.overview.fields) ? data.overview.fields : [];
      data.mobile ||= {};
      data.mobile.drawings ||= {};
      if (!Array.isArray(data.description)) data.description = parseDescription(data.descriptionHtml);
      if (!Array.isArray(data.gallery)) data.gallery = deriveGallery(data);
      data.gallery = data.gallery.map((slot) => newSlot(slot));
      return data;
    };

    const blankProject = (id) => ({
      id,
      title: "",
      overview: {
        titleEn: "",
        subtitle: "",
        fields: DEFAULT_FIELDS.map((label) => ({ label, value: "" })),
      },
      description: [],
      gallery: [],
      mobile: { drawings: { coordinateSrc: "", scaleSrc: "" } },
    });

    // ---------- upload ----------

    const detectKind = (file) => new Promise((resolve) => {
      if (/svg/.test(file.type) || /\.svg$/i.test(file.name)) return resolve({ type: "drawing" });
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        resolve({ type: "photo", orientation: img.naturalHeight > img.naturalWidth ? "portrait" : "landscape" });
        URL.revokeObjectURL(url);
      };
      img.onerror = () => { resolve({ type: "photo", orientation: "landscape" }); URL.revokeObjectURL(url); };
      img.src = url;
    });

    const ensureSaved = async () => {
      if (!saved.draft && !saved.runtime) await saveProject("draft", { quiet: true });
    };

    // device: "both" | PC | MOB. Resolves to { PC?: src, MOB?: src }.
    const upload = async (file, device) => {
      await ensureSaved();
      return store.upload(project.id, device, file);
    };

    // Oversized photos are scaled down in the browser before upload, keeping their proportions.
    // Gallery images fill the screen, so 3840px on the long edge covers a 4K display. Description
    // images show at most 300px wide on PC and full width on phones, so 1400px covers 3x screens.
    const GALLERY_SHRINK = { maxEdge: 3840, quality: 0.92, keepPng: true };
    const DESCRIPTION_SHRINK = { maxWidth: 1400, maxBytes: 1024 * 1024, quality: 0.85 };
    const MB = (bytes) => `${(bytes / 1048576).toFixed(1)}MB`;

    const shrinkImage = async (file, { maxEdge = Infinity, maxWidth = Infinity, maxBytes = Infinity, quality, keepPng = false }) => {
      if (/\.(svg|gif)$/i.test(file.name)) return file;
      const bitmap = await createImageBitmap(file).catch(() => null);
      if (!bitmap) return file;
      const ratio = Math.min(1, maxEdge / Math.max(bitmap.width, bitmap.height), maxWidth / bitmap.width);
      if (ratio === 1 && file.size <= maxBytes) return file;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * ratio);
      canvas.height = Math.round(bitmap.height * ratio);
      const context = canvas.getContext("2d");
      const png = keepPng && /\.png$/i.test(file.name);
      if (!png) {
        context.fillStyle = "#fff"; // JPG has no transparency; the pages are white behind images
        context.fillRect(0, 0, canvas.width, canvas.height);
      }
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, png ? "image/png" : "image/jpeg", quality));
      if (!blob || blob.size >= file.size) return file;

    const sortable = (container, list, onChange) => {
      let dragged = null;
      const release = () => container.querySelectorAll("[draggable=true]").forEach((item) => { item.draggable = false; });
      container.addEventListener("pointerdown", (event) => {
        const item = event.target.closest(".handle")?.closest("[data-index]");
        if (item) item.draggable = true;
      });
      container.addEventListener("pointerup", release);
      container.addEventListener("dragstart", (event) => {
        dragged = event.target.closest?.("[data-index]") || null;
        if (!dragged) return;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", "");
        dragged.classList.add("dragging");
      });
      container.addEventListener("dragover", (event) => {
        if (!dragged) return;
        event.preventDefault();
        const over = event.target.closest("[data-index]");
        if (!over || over === dragged || over.parentElement !== container) return;
        const rect = over.getBoundingClientRect();
        if (event.clientY > rect.top + rect.height / 2) over.after(dragged);
        else over.before(dragged);
      });
      container.addEventListener("drop", (event) => event.preventDefault());
      container.addEventListener("dragend", () => {
        if (!dragged) return;
        dragged.classList.remove("dragging");
        release();
        dragged = null;
        const order = [...container.children].map((child) => list[Number(child.dataset.index)]);
        if (order.every((item, index) => item === list[index])) return;
        list.splice(0, list.length, ...order);
        onChange();

        list.lastElementChild?.querySelector("textarea, input[type=text]")?.focus();
      };
      render();
      sortable(list, blocks, () => { render(); markDirty(); });
      return section("설명", "PC·모바일 공통", [
        list,
        h("div", { class: "row" },
          h("button", { type: "button", onclick: () => add({ type: "text", text: "" }) }, "+ 글"),
          h("button", { type: "button", onclick: () => uploadDescriptionImage((src) => add({ type: "image", src, caption: "" })) }, "+ 이미지")),
        h("p", { class: "hint" }, "글: Enter는 줄바꿈, 빈 줄(Enter 두 번)은 문단 나누기. 글 사이에 이미지를 넣으려면 '+ 이미지' 후 ⋮⋮ 를 끌어 위치를 옮기세요."),
        h("p", { class: "hint" }, "캡션: 각 이미지 아래 칸에 쓰면 이미지 바로 밑에 작은 글씨로 나옵니다. PC에서는 한 줄을 넘으면 '…'으로 잘리니 짧게 써 주세요."),
        h("p", { class: "hint" }, `이미지 형식: ${store.imageFormats}. 아이폰 사진(HEIC)·TIFF·PSD는 JPG로 바꿔서 올려주세요. 큰 사진은 비율 그대로 가로 ${DESCRIPTION_SHRINK.maxWidth}px로 자동으로 줄여서 올립니다.`),
      ]);
    };

    const mobileSection = () => {
      const drawings = project.mobile.drawings;
      const compass = h("span", { class: "compass" });
      const drawCompass = () => {
        compass.classList.toggle("off", drawings.north == null);
        compass.style.setProperty("--deg", `${drawings.north || 0}deg`);
      };
      drawCompass();
      return section("모바일 도면 설정", "방위표 · 축척 바", [
        h("p", { class: "hint" }, "도면 이미지는 위 '이미지'에서 종류를 '도면'으로 지정하세요. 여기서는 모바일 도면 아래에 나오는 방위표와 축척 바를 설정합니다."),
        h("label", { class: "field" },
          h("span", {}, "방위 — 북쪽 방향 (도면 위쪽 기준 시계방향 °)"),
          h("div", { class: "row" },
            h("input", {
              type: "number",
              step: "1",
              value: drawings.north ?? "",
              placeholder: "예: 22",
              oninput: (event) => {
                drawings.north = numberValue(event.target.value);
                if (drawings.north == null) delete drawings.north;
                drawCompass();
                markDirty();
              },
            }),
            compass)),
        h("label", { class: "field" },
          h("span", {}, "기본 축척 — 도면마다 다르면 위 '이미지'의 각 도면에서 따로 입력"),
          h("div", { class: "row" },
            h("span", { class: "hint" }, "1 :"),
            h("input", {
              type: "number",
              min: "1",
              value: drawings.scale ?? "",
              step: "any",
              placeholder: "예: 50",
              oninput: (event) => {
                drawings.scale = numberValue(event.target.value);
                if (drawings.scale == null) delete drawings.scale;
                markDirty();
              },
            }))),
        h("p", { class: "hint" }, "방위표와 축척 바(0·1·2·5m 형식)는 입력한 값으로 자동으로 그려집니다. 축척은 대지(pt)에 놓인 그대로의 축척을 넣으세요 — 상세도를 1:20으로 크게 그렸다면 그 도면에 20. 비율대로 키우거나 줄였다면 소수도 됩니다 (1:50을 2배로 키움 → 25). 모바일 미리보기로 확인하세요."),
        h("details", {},
          h("summary", { class: "hint" }, "직접 만든 이미지 쓰기 (각도·축척을 비워둔 경우에만 사용)"),
          h("div", { class: "stack", style: "padding-top:8px" },
            h("label", { class: "field" }, h("span", {}, "방위표 이미지"), srcInput(() => drawings.coordinateSrc, (value) => { drawings.coordinateSrc = value; }, MOB)),
            h("label", { class: "field" }, h("span", {}, "축척 바 이미지"), srcInput(() => drawings.scaleSrc, (value) => { drawings.scaleSrc = value; }, MOB)))),
      ], false);
    };

    const jsonSection = () => {
      const area = h("textarea", { class: "mono", rows: 14, spellcheck: false });
      const details = section("JSON", "저장되는 내용", [
        h("p", { class: "hint" }, "gallery와 description이 기준입니다. images · mobile.images · mobile.drawings.images는 gallery에서, descriptionHtml은 description에서 저장할 때 자동으로 만들어집니다."),
        area,
        h("div", { class: "row" },
          h("button", { type: "button", onclick: () => { area.value = JSON.stringify(compile(project), null, 2); } }, "현재 값 불러오기"),
          h("button", {
            type: "button",
            onclick: () => {
              try {
                const next = JSON.parse(area.value);
                next.id = project.id;
                project = ensureShape(next);
                renderEditor();
                markDirty();
                toast("JSON을 적용했습니다.");
              } catch (error) {
                toast(`JSON 오류: ${error.message}`, true);
              }
            },
          }, "적용")),
      ], false);
      details.addEventListener("toggle", () => { if (details.open) area.value = JSON.stringify(compile(project), null, 2); });
      return details;
    };

    const renderEditor = () => {
      editor.replaceChildren(
        basicSection(),
        overviewSection(),
        gallerySection(),
        descriptionSection(),
        mobileSection(),
        jsonSection(),
      );
      updateBadges();
      schedulePreview(0);
    };

    // ---------- preview ----------

    const layoutStage = () => {
      const stage = $("#stage");
      const inner = $("#stageInner");
      const size = VIEWPORTS[viewport];
      const availableWidth = stage.clientWidth - 24;
      const availableHeight = stage.clientHeight - 24;
      const scale = Math.min(1, availableWidth / size.width);
      const height = viewport === "mobile" ? Math.min(size.height, availableHeight / scale) : availableHeight / scale;
      inner.style.width = `${size.width}px`;
      inner.style.height = `${height}px`;
      inner.style.transform = `translateX(-50%) scale(${scale})`;
      $("#previewSize").textContent = `${size.width}px · ${Math.round(scale * 100)}%`;
      document.querySelectorAll("[data-device]").forEach((button) => button.classList.toggle("active", button.dataset.device === viewport));
    };

    // Uploaded images are relative paths; swap them for URLs this browser can load (blob: on GitHub Pages).
    const resolveAssets = async (out) => {
      const resolve = (src) => store.assetUrl(src);
      const fix = async (list) => Promise.all((list || []).map(async (item) => { item.src = await resolve(item.src); }));
      await Promise.all([fix(out.images), fix(out.mobile?.images), fix(out.mobile?.drawings?.images)]);
      const drawings = out.mobile?.drawings;
      if (drawings) {
        drawings.coordinateSrc = await resolve(drawings.coordinateSrc);
        drawings.scaleSrc = await resolve(drawings.scaleSrc);
      }
      const srcs = [...(out.descriptionHtml || "").matchAll(/src="([^"]+)"/g)].map((match) => match[1]).filter((src) => !isExternal(src));
      for (const src of new Set(srcs)) out.descriptionHtml = out.descriptionHtml.split(`src="${src}"`).join(`src="${await resolve(src)}"`);
      return out;
    };

    let previewToken = 0;
    const renderPreview = async () => {
      if (!project) return;
      const token = ++previewToken;
      const data = await resolveAssets(compile(project));
      if (token !== previewToken) return;
      const nextUrl = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      const templateSrc = store.runtimeUrl("project-template.js");
      frame.srcdoc = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}</style></head><body><div data-filt-project="preview"></div><script src="${templateSrc}" data-project-id="preview" data-project-src="${nextUrl}"><\/script></body></html>`;
      if (previewUrl) setTimeout(URL.revokeObjectURL.bind(URL, previewUrl), 5000);
      previewUrl = nextUrl;
    };

    const schedulePreview = (delay = 500) => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(renderPreview, delay);
    };

    document.querySelectorAll("[data-device]").forEach((button) => button.addEventListener("click", () => {
      viewport = button.dataset.device;
      layoutStage();
    }));
    $("#reloadPreview").addEventListener("click", renderPreview);
    new ResizeObserver(layoutStage).observe($("#stage"));

    // ---------- load / save ----------

    const updateBadges = () => {
      $("#badgeDraft").classList.toggle("on", saved.draft);
      $("#badgeRuntime").classList.toggle("on", saved.runtime);
    };

    const refreshList = async (selectId) => {
      projects = await store.listProjects();
      const selectEl = $("#projectSelect");
      selectEl.replaceChildren(...projects.map((entry) => h("option", { value: entry.id, selected: entry.id === selectId },
        `${entry.id}${entry.runtime ? "" : " (draft)"}`)));
      const current = projects.find((entry) => entry.id === selectId);
      if (current) saved = { draft: current.draft, runtime: current.runtime };
      updateBadges();
    };

    const confirmDiscard = () => !dirty || confirm("저장하지 않은 변경 사항이 있습니다. 버리고 이동할까요?");

    const setUrl = (id) => {
      const params = new URLSearchParams(location.search);
      params.set("id", id);
      history.replaceState(null, "", `?${params}`);
    };

    const loadProject = async (id) => {
      const { project: data } = await store.getProject(id);
      project = ensureShape(data);
      project.id = id;
      worksCategory = null;
      await refreshList(id);
      setUrl(id);
      renderEditor();
      setClean();
    };

    const saveProject = async (target, { quiet = false } = {}) => {
      if (!project) return;
      if (target === "runtime" && !confirm(
        "게시용으로 저장할까요?\n\n다음에 '게시'를 누르면 공개 페이지에 반영됩니다.",
      )) return;
      const result = await store.saveProject(project.id, target, compile(project));
      const row = await syncWorks();
      await refreshList(project.id);
      setClean();
      if (row) $("#worksField")?.replaceWith(worksField());
      const category = row && works.categories.find((entry) => entry.id === row.category)?.label;
      if (!quiet || row) toast(`저장했습니다: ${result.path}${row ? `\nWORKS 목록 반영: ${category}` : ""}`);
    };

    const guarded = (fn) => async (...args) => {
      try { await fn(...args); } catch (error) { toast(error.message, true); }
    };

    $("#saveDraft").addEventListener("click", guarded(() => saveProject("draft")));
    $("#saveRuntime").addEventListener("click", guarded(() => saveProject("runtime")));
    $("#projectSelect").addEventListener("change", guarded(async (event) => {
      if (!confirmDiscard()) { event.target.value = project?.id || ""; return; }
      await loadProject(event.target.value);
    }));
    $("#newProject").addEventListener("click", guarded(async () => {
      if (!confirmDiscard()) return;
      const id = (prompt("새 프로젝트 ID (영문 소문자, 숫자, 하이픈 — 예: seongsu-house)") || "").trim().toLowerCase();
      if (!id) return;
      if (!ID_RE.test(id) || id === "works") throw new Error("ID는 영문 소문자, 숫자, 하이픈만 쓸 수 있습니다. ('works'는 사용 불가)");
      if (projects.some((entry) => entry.id === id)) throw new Error(`"${id}"는 이미 있습니다.`);
      project = ensureShape(blankProject(id));
      worksCategory = null;
      saved = { draft: false, runtime: false };
      await saveProject("draft", { quiet: true });
      setUrl(id);
      renderEditor();
      toast(`"${id}" 프로젝트를 drafts에 만들었습니다.`);
    }));

    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        guarded(() => saveProject("draft"))();
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (dirty) { event.preventDefault(); event.returnValue = ""; }
    });

    guarded(async () => {
      layoutStage();
      await store.ready();
      store.mountHeader($("#account"));
      works = await store.getWorks().catch(() => null);
      await refreshList();
      const wanted = new URLSearchParams(location.search).get("id");
      const first = projects.find((entry) => entry.id === wanted) || projects[0];
      if (first) await loadProject(first.id);
      else editor.replaceChildren(h("div", { class: "empty" }, "프로젝트가 없습니다. '+ 새 프로젝트'로 시작하세요."));
    })();
  })();
  </script>
</body>
</html>
