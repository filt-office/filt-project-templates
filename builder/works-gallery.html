<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WORKS GALLERY · FILT. BUILDER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suit-font@1.0.0/dist/suit.min.css">
  <style>
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .card { display: grid; grid-template-rows: auto auto; border: 1px solid #111; background: #fff; }
    .card.drop-before { box-shadow: -5px 0 0 #111; }
    .card.drop-after { box-shadow: 5px 0 0 #111; }
    .card-media { position: relative; aspect-ratio: 4 / 3; background: #eee center / cover no-repeat; cursor: grab; }
    .card-media.empty { background-image: linear-gradient(to top right, transparent calc(50% - .6px), #d4d4d4 50%, transparent calc(50% + .6px)), linear-gradient(to bottom right, transparent calc(50% - .6px), #d4d4d4 50%, transparent calc(50% + .6px)); }
    .card-media .no { position: absolute; top: 0; left: 0; padding: 2px 7px; background: #111; color: #fff; font-size: 11px; }
    .card-media.busy { opacity: .45; pointer-events: none; }
    .card-media.file-over { box-shadow: inset 0 0 0 3px var(--key); }
    .card-name { overflow: hidden; padding: 6px 8px; border-top: 1px solid #111; text-overflow: ellipsis; white-space: nowrap; }
    .card-media .device { position: absolute; top: 0; right: 0; padding: 2px 7px; background: #fff; color: #111; font-size: 11px; }
  </style>
</head>
<body>
  <header class="fb-header" data-active="works-gallery">
    <div class="fb-actions" id="account">
      <span class="dirty" id="dirty" title="저장 안 됨">●</span>
      <button class="fb-act" disabled title="WORKS는 임시저장이 없습니다. save가 바로 게시 대상에 저장합니다.">draft</button>
      <button id="save" class="fb-act" title="저장 (Ctrl+S)">save</button>
    </div>
  </header>
  <script src="header.js"></script>
  <script src="store.js"></script>
  <script src="row-menu.js"></script>
  <script src="page-editor.js"></script>
  <script>
  (() => {
    "use strict";

    // Same works.json as the WORKS sheet. Every work is a card in galleryOrder (rows without one
    // follow in sheet order); the card picture is cardThumb, falling back to the list thumbnail,
    // as in runtime/works.js. 보관 (show.gallery off) greys a card in place; show.mobile is the
    // mobile gallery, toggled from the same menu, as is mobileShape (the mobile card's ratio).
    const byGalleryOrder = (works) => works
      .map((work, index) => ({ work, index }))
      .sort((a, b) => (a.work.galleryOrder ?? Infinity) - (b.work.galleryOrder ?? Infinity) || a.index - b.index)
      .map(({ work }) => work);
    const renumber = (ordered) => ordered.forEach((work, index) => { work.galleryOrder = index + 1; });
    const nameOf = (work) => [work.nameKo, work.nameEn].filter(Boolean).join(" | ") || work.id || "(이름 없음)";

    FiltPageEditor({
      page: "works-gallery",
      load: () => FiltStore.getWorks(),
      save: (data) => FiltStore.saveWorks(data),
      previewBody: (dataUrl, runtimeUrl) => `<div data-filt-works></div><script src="${runtimeUrl("works.js")}" data-view="gallery" data-works-src="${dataUrl}" data-list-url="#" data-gallery-url="#"><\/script>`,
      assetKeys: ["thumb", "cardThumb"],
      render: (ctx) => {
        const { h, data } = ctx;
        data.works = data.works || [];
        const works = byGalleryOrder(data.works);
        const shown = works.filter((work) => work.show?.gallery);
        const change = () => { ctx.rerender(); ctx.markDirty(); };
        const toggle = (work, key) => { work.show = { ...work.show, [key]: !work.show?.[key] }; change(); };

        const card = (work, index) => {
          const src = work.cardThumb || work.thumb;
          const inGallery = Boolean(work.show?.gallery);
          const onMobile = Boolean(work.show?.mobile);
          const pic = h("div", { class: `card-media${src ? "" : " empty"}` },
            inGallery ? h("span", { class: "no" }, String(shown.indexOf(work) + 1)) : null,
            inGallery !== onMobile ? h("span", { class: "device" }, inGallery ? "PC만" : "모바일만") : null);
          if (src) FiltStore.assetUrl(src).then((url) => { if (url) pic.style.backgroundImage = `url("${url.replace(/"/g, "%22")}")`; });
          // Click (or drop a file on) the picture to replace the gallery card image.
          const replace = async (file) => {
            if (!file) return;
            pic.classList.add("busy");
            try {
              ctx.toast("업로드 중…");
              // Works thumbnails go to both PC/ and MOB/, as in the WORKS sheet.
              work.cardThumb = (await FiltStore.upload("works", "both", file)).PC;
              change();
              ctx.toast("교체했습니다");
            } catch (error) {
              pic.classList.remove("busy");
              ctx.toast(error.message, true);
            }
          };
          const isFile = (event) => event.dataTransfer?.types.includes("Files");
          pic.title = "눌러서 카드 이미지 교체 · 끌어서 순서 변경 · 우클릭으로 보관/삭제";
          pic.addEventListener("click", async () => replace((await ctx.pickFiles())[0]));
          pic.addEventListener("dragover", (event) => { if (isFile(event)) { event.preventDefault(); pic.classList.add("file-over"); } });
          pic.addEventListener("dragleave", () => pic.classList.remove("file-over"));
          pic.addEventListener("drop", (event) => {
            if (!isFile(event)) return;
            event.preventDefault();
            event.stopPropagation();
            pic.classList.remove("file-over");
            replace(event.dataTransfer.files[0]);
          });
          const el = h("div", { class: `card${inGallery ? "" : " archived"}` }, pic, h("div", { class: "card-name", title: nameOf(work) }, nameOf(work)));
          FiltRowMenu.attach(el, {
            label: nameOf(work),
            items: [
              inGallery
                ? { text: "보관", hint: "PC 갤러리에서 빠집니다", run: () => toggle(work, "gallery") }
                : { text: "보관 해제", hint: "PC 갤러리에 다시 나옵니다", run: () => toggle(work, "gallery") },
              onMobile
                ? { text: "모바일에서 숨기기", hint: "모바일 갤러리에서 빠집니다", run: () => toggle(work, "mobile") }
                : { text: "모바일에 보이기", hint: "모바일 갤러리에 나옵니다", run: () => toggle(work, "mobile") },
              work.mobileShape === "square"
                ? { text: "모바일 비율: 정사각 → 세로", hint: "모바일 카드를 세로로 길게", run: () => { work.mobileShape = "tall"; change(); } }
                : { text: "모바일 비율: 세로 → 정사각", hint: "모바일 카드를 정사각으로", run: () => { work.mobileShape = "square"; change(); } },
              {
                text: "삭제",
                hint: "WORKS 목록에서도 지웁니다",
                danger: true,
                run: () => {
                  if (!confirm(`${nameOf(work)}을(를) 삭제할까요? WORKS 목록에서도 지워집니다.`)) return;
                  data.works.splice(data.works.indexOf(work), 1);
                  change();
                },
              },
            ],
          });
          return ctx.draggable(el, { list: works, index, handle: pic, axis: "x", onMove: renumber });
        };

        return ctx.section(`WORKS GALLERY (${shown.length} / ${works.length})`, null,
          works.length ? h("div", { class: "cards" }, works.map(card)) : h("p", { class: "muted" }, "작업이 없습니다."));
      },
    });
  })();
  </script>
</body>
</html>
