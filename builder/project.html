        tool(TEXT_ICONS.left, "왼쪽 정렬", align === "left", () => setAlign("left")),
        tool(TEXT_ICONS.center, "가운데 정렬", align === "center", () => setAlign("center")),
        tool(TEXT_ICONS.right, "오른쪽 정렬", align === "right", () => setAlign("right")),
        h("span", { class: "tool-gap" }),
        tool(TEXT_ICONS.outdent, "내어쓰기 — 단락 전체를 왼쪽으로", level < 0, () => setLevel(level - 1)),
        tool(TEXT_ICONS.indent, "들여쓰기 — 단락 전체를 오른쪽으로", level > 0, () => setLevel(level + 1)),
        level ? h("span", { class: "tool-level" }, `${level > 0 ? "들여쓰기" : "내어쓰기"} ${Math.abs(level)}`) : null);
    };
    // The edit box shows the alignment; the sideways shift shows in the preview and as the level number.
    const previewStyle = (element, align) => {
      element.style.textAlign = align === "center" || align === "right" ? align : "";
    };

    const descriptionSection = () => {
      const blocks = project.description;
      const list = h("div", { class: "sheet-list" });
      const textBlock = (block, index) => {
        const area = h("div", { class: "block-text", contentEditable: "true", "data-placeholder": "본문" });
        area.innerHTML = blockHtml(block);
        area.addEventListener("input", () => {
          block.html = sanitizeRich(area);
          delete block.text;
          markDirty();
        });
        // Enter is a line break (a blank line starts a new paragraph); pasted text arrives plain.
        area.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.isComposing) { event.preventDefault(); document.execCommand("insertLineBreak"); }
        });
        area.addEventListener("paste", (event) => {
          event.preventDefault();
          document.execCommand("insertText", false, event.clipboardData.getData("text/plain"));
        });
        previewStyle(area, block.align, block.indent);
        const tools = textTools(block, ["align", "indent"], render);
        tools.append(...richTools(area));
        return rowMenu(h("div", { class: "sheet-row block-row", dataset: { index } },
          dragHandle(), h("div", { class: "text-cell" }, tools, area)), blocks, block, render, "글");
      };
      const imageBlock = (block, index) => {
        const caption = textInput(() => block.caption, (value) => { block.caption = value; }, { placeholder: "캡션" });
        previewStyle(caption, block.captionAlign, block.captionIndent);
        return rowMenu(h("div", { class: "sheet-row image-row", dataset: { index } },
          dragHandle(),
          thumbButton(block.src, null, "이미지 교체", () => uploadDescriptionImage((src) => { block.src = src; render(); markDirty(); })),
          h("div", { class: "text-cell" }, textTools(block, ["captionAlign", "captionIndent"], render), caption)), blocks, block, render, "이미지");
      };
      const render = () => list.replaceChildren(...blocks.map((block, index) => (block.type === "image" ? imageBlock(block, index) : textBlock(block, index))));
      const add = (block) => {
        blocks.push(block);
        render();
        markDirty();
        list.lastElementChild?.querySelector("div.block-text, input[type=text]")?.focus();
      };
      render();
      sortable(list, blocks, () => { render(); markDirty(); });
      // Image files dropped on the description become image blocks after the row they land on.
      const sheetBox = h("div", { class: "sheet" }, list, h("div", { class: "add-line" },
        addButton("+ 글", () => add({ type: "text", html: "" })),
        addButton("+ 이미지", () => uploadDescriptionImage((src) => add({ type: "image", src, caption: "" })))));
      const isFile = (event) => event.dataTransfer?.types.includes("Files");
      sheetBox.addEventListener("dragover", (event) => { if (isFile(event)) { event.preventDefault(); sheetBox.classList.add("file-over"); } });
      sheetBox.addEventListener("dragleave", (event) => { if (!sheetBox.contains(event.relatedTarget)) sheetBox.classList.remove("file-over"); });
      sheetBox.addEventListener("drop", async (event) => {
        if (!isFile(event)) return;
        event.preventDefault();
        sheetBox.classList.remove("file-over");
        const row = event.target.closest?.("[data-index]");
        let at = row ? Number(row.dataset.index) + 1 : blocks.length;
        await uploadMany([...event.dataTransfer.files], PC, (_, src) => {
          blocks.splice(at, 0, { type: "image", src: src[PC], caption: "" });
          at += 1;
          render();
          markDirty();
        }, DESCRIPTION_SHRINK);
      });
      return section("설명", null, sheetBox);
    };

    const jsonSection = () => {
      const area = h("textarea", { class: "mono", rows: 14, spellcheck: false });
      const details = section("JSON", null, [
        area,
        h("div", { class: "row" },
          h("button", { type: "button", onclick: () => { area.value = JSON.stringify(compile(project), null, 2); } }, "현재 값 불러오기"),
          h("button", {
            type: "button",
            onclick: () => {
              try {
                const next = JSON.parse(area.value);
                next.id = project.id;
                project = ensureShape(next);
                renderEditor();
                markDirty();
                toast("JSON을 적용했습니다.");
              } catch (error) {
                toast(`JSON 오류: ${error.message}`, true);
              }
            },
          }, "적용")),
      ], false);
      details.addEventListener("toggle", () => { if (details.open) area.value = JSON.stringify(compile(project), null, 2); });
      return details;
    };

    const renderEditor = () => {
      editor.replaceChildren(
        basicSection(),
        overviewSection(),
        gallerySection(),
        descriptionSection(),
        jsonSection(),
      );
      updateBadges();
      schedulePreview(0);
    };

    // ---------- preview ----------

    const layoutStage = () => {
      const stage = $("#stage");
      const inner = $("#stageInner");
      const size = VIEWPORTS[viewport];
      const availableWidth = stage.clientWidth - 24;
      const availableHeight = stage.clientHeight - 24;
      const scale = Math.min(1, availableWidth / size.width);
      const height = viewport === "mobile" ? Math.min(size.height, availableHeight / scale) : availableHeight / scale;
      inner.style.width = `${size.width}px`;
      inner.style.height = `${height}px`;
      inner.style.transform = `translateX(-50%) scale(${scale})`;
      $("#previewSize").textContent = `${size.width}px · ${Math.round(scale * 100)}%`;
      document.querySelectorAll("[data-device]").forEach((button) => button.classList.toggle("active", button.dataset.device === viewport));
    };

    // Uploaded images are relative paths; swap them for URLs this browser can load (blob: on GitHub Pages).
    const resolveAssets = async (out) => {
      const resolve = (src) => store.assetUrl(src);
      const fix = async (list) => Promise.all((list || []).map(async (item) => { item.src = await resolve(item.src); }));
      await Promise.all([fix(out.images), fix(out.mobile?.images), fix(out.mobile?.drawings?.images)]);
      const drawings = out.mobile?.drawings;
      if (drawings) {
        drawings.coordinateSrc = await resolve(drawings.coordinateSrc);
        drawings.scaleSrc = await resolve(drawings.scaleSrc);
      }
      const srcs = [...(out.descriptionHtml || "").matchAll(/src="([^"]+)"/g)].map((match) => match[1]).filter((src) => !isExternal(src));
      for (const src of new Set(srcs)) out.descriptionHtml = out.descriptionHtml.split(`src="${src}"`).join(`src="${await resolve(src)}"`);
      return out;
    };

    let previewToken = 0;
    const renderPreview = async () => {
      if (!project) return;
      const token = ++previewToken;
      const data = await resolveAssets(FiltRowMenu.withoutArchived(compile(project)));
      if (token !== previewToken) return;
      const nextUrl = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      const templateSrc = store.runtimeUrl("project-template.js");
      frame.srcdoc = `<!doctype html><html lang="ko"${FiltStore.designAttrs()}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}</style></head><body><div data-filt-project="preview"></div><script src="${templateSrc}" data-project-id="preview" data-project-src="${nextUrl}"><\/script></body></html>`;
      if (previewUrl) setTimeout(URL.revokeObjectURL.bind(URL, previewUrl), 5000);
      previewUrl = nextUrl;
    };

    document.addEventListener("filt-design", () => schedulePreview());
    const schedulePreview = (delay = 500) => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(renderPreview, delay);
    };

    document.querySelectorAll("[data-device]").forEach((button) => button.addEventListener("click", () => {
      viewport = button.dataset.device;
      layoutStage();
    }));
    $("#reloadPreview").addEventListener("click", renderPreview);
    new ResizeObserver(layoutStage).observe($("#stage"));

    // ---------- load / save ----------

    const updateBadges = () => {
      $("#badgeDraft").classList.toggle("on", saved.draft);
      $("#badgeRuntime").classList.toggle("on", saved.runtime);
    };

    const refreshList = async (selectId) => {
      projects = await store.listProjects();
      const selectEl = $("#projectSelect");
      selectEl.replaceChildren(...projects.map((entry) => h("option", { value: entry.id, selected: entry.id === selectId },
        `${entry.id}${entry.runtime ? "" : " (draft)"}`)));
      const current = projects.find((entry) => entry.id === selectId);
      if (current) saved = { draft: current.draft, runtime: current.runtime };
      updateBadges();
    };

    // Unsaved changes: the builder's own dialog (header.js) offers 임시저장 and go / go without saving / stay.
    const confirmDiscard = () => window.FiltHeader.leave();
    window.FiltHeader.guard({
      isDirty: () => dirty,
      saveLabel: "임시저장하고 이동",
      save: () => saveProject("draft").then(() => true, (error) => { toast(error.message, true); return false; }),
      discard: setClean,
    });

    const setUrl = (id) => {
      const params = new URLSearchParams(location.search);
      params.set("id", id);
      history.replaceState(null, "", `?${params}`);
    };

    const loadProject = async (id) => {
      const { project: data } = await store.getProject(id);
      project = ensureShape(data);
      project.id = id;
      store.rememberProject(id, compile(project));
      worksCategory = null;
      await refreshList(id);
      setUrl(id);
      renderEditor();
      setClean();
    };

    const saveProject = async (target, { quiet = false } = {}) => {
      if (!project) return;
      if (target === "runtime" && !confirm(
        "게시용으로 저장할까요?\n\n다음에 deploy를 누르면 공개 페이지에 반영됩니다.",
      )) return;
      const result = await store.saveProject(project.id, target, compile(project));
      project.edited = result.edited;
      $("#editedRow")?.replaceWith(editedRow());
      const row = await syncWorks();
      await refreshList(project.id);
      setClean();
      if (row) $("#worksField")?.replaceWith(worksField());
      const category = row && works.categories.find((entry) => entry.id === row.category)?.label;
      if (!quiet || row) toast(`저장했습니다: ${result.path}${row ? `\nWORKS 목록 반영: ${category}` : ""}`);
    };

    const guarded = (fn) => async (...args) => {
      try { await fn(...args); } catch (error) { toast(error.message, true); }
    };

    $("#saveDraft").addEventListener("click", guarded(() => saveProject("draft")));
    $("#saveRuntime").addEventListener("click", guarded(() => saveProject("runtime")));
    $("#projectSelect").addEventListener("change", guarded(async (event) => {
      if (!(await confirmDiscard())) { event.target.value = project?.id || ""; return; }
      await loadProject(event.target.value);
    }));
    $("#newProject").addEventListener("click", guarded(async () => {
      if (!(await confirmDiscard())) return;
      // The ID follows the English title: "Seongsu House" → seongsu-house (-2, -3 … if taken).
      const titleEn = (prompt("새 프로젝트 영문 제목 (예: SEONGSU HOUSE)") || "").trim();
      if (!titleEn) return;
      const base = titleEn.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
      if (!base || base === "works") throw new Error("영문 제목에 영문이나 숫자가 있어야 합니다.");
      let id = base;
      for (let n = 2; projects.some((entry) => entry.id === id); n += 1) id = `${base}-${n}`;
      project = ensureShape(blankProject(id));
      project.overview.titleEn = titleEn.toUpperCase();
      worksCategory = null;
      saved = { draft: false, runtime: false };
      await saveProject("draft", { quiet: true });
      setUrl(id);
      renderEditor();
      toast(`"${id}" 프로젝트를 drafts에 만들었습니다.`);
    }));

    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        guarded(() => saveProject("draft"))();
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (dirty) { event.preventDefault(); event.returnValue = ""; }
    });

    guarded(async () => {
      layoutStage();
      await store.ready();
      store.mountHeader($("#account"));
      works = await store.getWorks().catch(() => null);
      await refreshList();
      const wanted = new URLSearchParams(location.search).get("id");
      const first = projects.find((entry) => entry.id === wanted) || projects[0];
      if (first) await loadProject(first.id);
      else editor.replaceChildren(h("div", { class: "empty" }, "프로젝트가 없습니다. '+ 새 프로젝트'로 시작하세요."));
    })();
  })();
  </script>
</body>
</html>
