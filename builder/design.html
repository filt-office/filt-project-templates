<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DESIGN · FILT. BUILDER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suit-font@1.0.0/dist/suit.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    /* The page is the design guide itself: chapters with the live specimen and its values. */
    .guide { max-width: 1120px; margin: 0 auto; padding: 8px 24px 80px; }
    .preview-page { height: 26px; padding: 0 6px; border: 1px solid #111; background: #fff; }
    .chapter { display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 36px 0; border-bottom: 1.5px solid #111; }
    .chapter > header h2 { margin: 0; font: 700 13px/1.3 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .02em; }
    .chapter > header .no { display: block; margin-bottom: 6px; color: var(--filt-key, #BD005E); font: 700 28px/1 "IBM Plex Mono", ui-monospace, monospace; }
    .chapter > header p { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .chapter > header button { margin-top: 12px; }

    /* values: label / input pairs in one hairline sheet */
    .values { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); border: 1px solid #111; border-right: 0; border-bottom: 0; }
    .value { display: grid; grid-template-columns: 1fr 140px; align-items: center; border-right: 1px solid #111; border-bottom: 1px solid #111; }
    .value > span { padding: 0 10px; font-size: 12px; }
    .value input, .value select { width: 100%; height: 34px; padding: 0 8px; border: 0; border-left: 1px solid var(--line); background: #fff; font: 12px ui-monospace, Consolas, monospace; }
    .value input:focus, .value select:focus { outline: 2px solid #111; outline-offset: -2px; }
    .value.wide { grid-column: 1 / -1; grid-template-columns: 180px 1fr; }

    /* 01 colour */
    .colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .color { display: grid; border: 1px solid #111; background: #fff; }
    .color.drop-before { box-shadow: -5px 0 0 #111; }
    .color.drop-after { box-shadow: 5px 0 0 #111; }
    .swatch { position: relative; height: 120px; cursor: grab; }
    .swatch .badge { position: absolute; top: 0; left: 0; padding: 2px 7px; background: #fff; color: #111; font-size: 11px; }
    .swatch input[type="color"] { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; padding: 0; border: 1px solid #fff; background: none; cursor: pointer; }
    .color input[type="text"] { width: 100%; height: 30px; padding: 0 8px; border: 0; border-top: 1px solid #111; background: #fff; }
    .color input.hex { font-family: ui-monospace, Consolas, monospace; text-transform: uppercase; }
    .color input:focus { outline: 2px solid #111; outline-offset: -2px; }

    /* 02 logo */
    .logo-stage { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .logo-box { position: relative; display: grid; place-items: center; height: 300px; border: 1px solid #111; background: #fff; }
    .logo-box span { position: absolute; top: 6px; left: 8px; color: var(--muted); font-size: 11px; }
    .logo-box svg { width: auto; height: 240px; overflow: visible; fill: none; stroke: var(--filt-logo-color, #000); stroke-width: var(--filt-logo-stroke, 5); }
    .logo-box.mark svg { height: 72px; }
    .logo-box.play { cursor: pointer; }
    .logo-box.play:hover { border-color: var(--filt-key, #BD005E); }
    .logo-box .copy { position: absolute; right: 6px; bottom: 6px; padding: 2px 7px; font-size: 11px; }
    .logo-box.intro { grid-column: 1 / -1; height: 360px; overflow: hidden; }
    .logo-box.intro svg { position: absolute; inset: 0; width: 100%; height: 100%; stroke-width: initial; }
    .chapter > header .copy-all { display: block; margin-top: 8px; }
    .color input.hex { cursor: copy; }

    /* 03 type family / 04 scale */
    .family-sample { margin: 0 0 14px; font-family: var(--filt-font-family); font-weight: var(--filt-font-weight); font-size: 44px; line-height: 1.15; letter-spacing: .01em; }
    .family-sample small { display: block; margin-top: 6px; font-size: 15px; line-height: 1.6; }
    table.scale { width: 100%; border-collapse: collapse; border: 1px solid #111; background: #fff; }
    .scale th { padding: 6px 8px; background: #111; color: #fff; font-weight: 500; text-align: left; white-space: nowrap; }
    .scale td { height: 40px; padding: 0; border-top: 1px solid #111; border-left: 1px solid var(--line); vertical-align: middle; }
    .scale td.name { padding: 0 10px; white-space: nowrap; }
    .scale td.sample { width: 100%; padding: 6px 12px; font-family: var(--filt-font-family); }
    .scale td input { width: 64px; height: 40px; padding: 0 8px; border: 0; background: transparent; font: 12px ui-monospace, Consolas, monospace; }
    .scale td input:focus { outline: 2px solid #111; outline-offset: -2px; background: #fff; }

    /* 05 motion */
    .motion-demo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .motion-box { position: relative; height: 140px; overflow: hidden; border: 1px solid #111; background: #fff; }
    .motion-box > span { position: absolute; z-index: 2; top: 6px; right: 8px; color: var(--muted); font-size: 11px; }
    .motion-box .panel { position: absolute; top: 0; bottom: 0; left: -70%; width: 80%; border-right: 1px solid #111; background: #fafaf8; transition: left var(--filt-motion-panel, .35s) ease; cursor: pointer; }
    .motion-box.open .panel { left: 0; }
    .motion-box .links { position: absolute; inset: 40px 0 0 24px; display: grid; align-content: start; gap: 4px; font-size: 12px; }
    .motion-box .links a { width: max-content; color: #111; text-decoration: none; transition: all var(--filt-motion-hover, .2s) ease; }
    .motion-box .links a:hover { color: var(--filt-key, #BD005E); font-weight: 700; transform: translateX(3px); }

    /* 06 layout */
    .facts { margin: 0; padding: 0; border: 1px solid #111; border-bottom: 0; list-style: none; background: #fff; }
    .facts li { display: grid; grid-template-columns: 180px 1fr; border-bottom: 1px solid #111; }
    .facts li > * { padding: 9px 10px; font-size: 12px; }
    .facts li b { border-right: 1px solid var(--line); font-weight: 500; }
    .facts code { font-size: 11px; }
  </style>
</head>
<body>
  <header class="fb-header" data-active="design">
    <div class="fb-actions" id="account">
      <span class="dirty" id="dirty" title="저장 안 됨">●</span>
      <button class="fb-act" disabled title="디자인 시스템은 임시저장이 없습니다. save가 바로 게시 대상에 저장합니다.">draft</button>
      <button id="save" class="fb-act" title="저장 (Ctrl+S)">save</button>
    </div>
  </header>
  <script src="header.js"></script>
  <script src="store.js"></script>
  <script src="row-menu.js"></script>
  <script src="page-editor.js"></script>
  <script>
  (() => {
    "use strict";

    // runtime/pages/design.json, shown as the site's design guide. Every value is live: the specimens
    // read the same CSS variables the site gets (FiltStore.designVars, runtime/design.js).
    const HEX_RE = /^#[0-9a-f]{6}$/i;
    const h = (tag, props = {}, ...children) => {
      const el = document.createElement(tag);
      Object.entries(props).forEach(([key, value]) => {
        if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
        else if (key === "class") el.className = value;
        else el.setAttribute(key, value);
      });
      el.append(...children.flat());
      return el;
    };
    const SVG_NS = "http://www.w3.org/2000/svg";

    // The FILT mark from runtime/common-menu-v2.js: the folded mark (menu panel) and the full logo.
    const SHAPES = {
      panel: ["M28.2,265.02v54.66", "M25.78,267.47h19.22", "M18,289.07h6", "M32.4,289.07h9.6", "M42,289.07h9.6", "M60,289.07h24",
        "M55.8,289.07v30.6", "M55.8,264.47v24.6", "M72,293.27v26.4", "M72,264.47v20.4", "M42,293.27v26.4", "M67.81,317.17h-14.46"],
      logo: ["M49.37-.25v270.82", "M85.87,261.57h39", "M-.13,289.07h69", "M45,301.57h53.87", "M93.37,327.57h27.5", "M164.87,299.07h75.13",
        "M93.37,314.57v75", "M114.87,270.35v45.23", "M149.87,382.37v27.63", "M209.87,296.57v42", "M68.87,258.57v33", "M239.87,355.57h-125"],
    };
    // "Mx,y h|v n" → [x1, y1, x2, y2]
    const ends = (d) => {
      const [, x, y, dir, n] = d.match(/^M(-?[\d.]+),?(-?[\d.]+)([hv])(-?[\d.]+)$/);
      const [x1, y1, len] = [Number(x), Number(y), Number(n)];
      return dir === "h" ? [x1, y1, x1 + len, y1] : [x1, y1, x1, y1 + len];
    };
    const lineD = ([x1, y1, x2, y2]) => `M${x1},${y1}L${x2},${y2}`;
    const markSvg = (stage, viewBox) => {
      const svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("viewBox", viewBox);
      SHAPES[stage].forEach((d) => {
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", lineD(ends(d)));
        svg.append(path);
      });
      return svg;
    };
    // GSAP's ease names, so the menu script can use the saved value as is.
    const EASES = [["power2.inOut", "부드럽게 (기본)"], ["power1.inOut", "약하게"], ["power3.inOut", "강하게"], ["power2.out", "빠르게 시작"], ["power2.in", "천천히 시작"], ["none", "일정하게"]];
    const ease = (name, t) => {
      const [kind, dir] = name.split(".");
      if (kind === "none") return t;
      const n = Number(kind.replace("power", "")) + 1;
      if (dir === "in") return t ** n;
      if (dir === "out") return 1 - (1 - t) ** n;
      return t < 0.5 ? (2 * t) ** n / 2 : 1 - (2 - 2 * t) ** n / 2;
    };
    // Morphs svg's lines from one stage to the other, as the site's menu does.
    const morph = (svg, from, to, seconds, easeName) => {
      const a = SHAPES[from].map(ends);
      const b = SHAPES[to].map(ends);
      const paths = [...svg.children];
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / (seconds * 1000));
        const k = ease(easeName, t);
        paths.forEach((path, i) => path.setAttribute("d", lineD(a[i].map((v, j) => v + (b[i][j] - v) * k))));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    // HOME intro, from the principal's home widget: 12 lines start scattered (a 1200 × 2600 reference
    // centred on the screen, scaled to its height × 1.1) and gather into the large mark (scaled by
    // intro.scale), hold, then dock on the menu logo.
    const INTRO_START = [
      [237, 0, 237, 1613.63], [419.5, 1568.63, 614.5, 1568.63], [-240, 1706.13, 345, 1706.13], [214.5, 1768.63, 484.5, 1768.63],
      [457, 1898.63, 594.5, 1898.63], [814.5, 1756.13, 1300, 1756.13], [564.5, 2038.63, 843, 2038.63], [457, 1831.13, 457, 2208.63],
      [1039.5, 1756.13, 1039.5, 1953.63], [843, 2038.63, 3000, 2038.63], [334.5, 1553.63, 334.5, 1706.13], [739.51, 2556, 739.51, 2173.62],
    ];
    const INTRO_MARK = [
      [494.5, 1163, 494.5, 1393], [482, 1175.5, 564.5, 1175.5], [452, 1265.5, 477, 1265.5], [512, 1265.5, 552, 1265.5],
      [552, 1265.5, 592, 1265.5], [627, 1265.5, 667, 1265.5], [677, 1163, 677, 1248], [609.5, 1163, 609.5, 1393],
      [677, 1283, 677, 1393], [667, 1265.5, 727, 1265.5], [552, 1283, 552, 1393], [659.5, 1380.5, 597, 1380.5],
    ];
    const playIntro = (box, svg, intro) => {
      const w = box.clientWidth;
      const hgt = box.clientHeight;
      const s1 = (hgt / 2600) * 1.1;
      const starts = INTRO_START.map((line) => line.map((v, i) => (i % 2 ? (v - 1300) * s1 + hgt / 2 : (v - 600) * s1 + w / 2)));
      const s2 = (Math.min(150, Math.max(110, w * 0.09), hgt * 0.24) / 275) * intro.scale;
      const marks = INTRO_MARK.map((line) => line.map((v, i) => (i % 2 ? (v - 1278) * s2 + hgt / 2 : (v - 589.5) * s2 + w / 2)));
      svg.setAttribute("viewBox", `0 0 ${w} ${hgt}`);
      svg.style.strokeWidth = 25 * s2;
      const paths = [...svg.children];
      const t0 = performance.now();
      const step = (now) => {
        const elapsed = (now - t0) / 1000;
        svg.style.opacity = Math.min(1, elapsed / Math.max(intro.appear, 0.001));
        const t = Math.min(1, Math.max(0, (elapsed - intro.appear) / intro.gather));
        const k = ease("power2.inOut", t);
        paths.forEach((path, i) => path.setAttribute("d", lineD(starts[i].map((v, j) => v + (marks[i][j] - v) * k))));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    // Copy as SVG / CSS for use elsewhere.
    const copyText = async (text, what, toast) => {
      try {
        await navigator.clipboard.writeText(text);
        toast(`${what}을(를) 복사했습니다`);
      } catch {
        prompt(`${what} — 아래 내용을 복사하세요`, text);
      }
    };
    const strokeColor = (design) => (design.logo.color === "black" ? "#000000" : (design.colors.find((color) => color.id === design.logo.color)?.value || "#000000"));
    const svgMarkup = (lines, viewBox, stroke, color) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" fill="none" stroke="${color}" stroke-width="${stroke}">\n${lines.map((l) => `  <path d="M${l[0]},${l[1]}L${l[2]},${l[3]}"/>`).join("\n")}\n</svg>\n`;
    const cssMarkup = (design) => `:root {\n${Object.entries(FiltStore.designVars(design)).map(([name, value]) => `  ${name}: ${value};`).join("\n")}\n}\n`;

    const nextId = (colors) => {
      let n = 2;
      while (colors.some((color) => color.id === `key-${n}`)) n += 1;
      return `key-${n}`;
    };

    // ---------- preview: a real page of the site, drawn with the unsaved design ----------
    // Each page's saved data is loaded once (images resolved to URLs this browser can load); the
    // design values reach the frame through FiltStore.designAttrs() on its <html>.
    const PREVIEW_PAGES = [["home", "HOME"], ["office", "OFFICE"], ["news", "NEWS"], ["works", "WORKS"], ["project", "상세페이지"]];
    const ASSET_KEYS = ["src", "image", "thumb", "cardThumb", "coordinateSrc", "scaleSrc"];
    const resolveAll = async (value) => {
      if (Array.isArray(value)) return Promise.all(value.map(resolveAll));
      if (!value || typeof value !== "object") return value;
      const out = {};
      await Promise.all(Object.entries(value).map(async ([key, item]) => {
        if (ASSET_KEYS.includes(key) && typeof item === "string") out[key] = await FiltStore.assetUrl(item);
        else if (key === "descriptionHtml" && typeof item === "string") {
          let html = item;
          for (const src of new Set([...html.matchAll(/src="([^"]+)"/g)].map((match) => match[1]).filter((src) => !FiltStore.isExternal(src)))) {
            html = html.split(`src="${src}"`).join(`src="${await FiltStore.assetUrl(src)}"`);
          }
          out[key] = html;
        } else out[key] = await resolveAll(item);
      }));
      return out;
    };
    const loadPreviewData = async (page) => {
      if (page === "works") return FiltStore.getWorks();
      if (page === "project") {
        const projects = await FiltStore.listProjects();
        const pick = projects.find((entry) => entry.runtime) || projects[0];
        if (!pick) throw new Error("상세페이지가 없습니다.");
        return (await FiltStore.getProject(pick.id)).project;
      }
      return FiltStore.getPage(page);
    };
    const previewData = {};
    let previewPage = "home";
    let editor = null;
    const showPage = async (page) => {
      previewPage = page;
      if (!previewData[page]) {
        try {
          const data = await resolveAll(await loadPreviewData(page));
          previewData[page] = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
        } catch (error) {
          editor?.toast(error.message, true);
          return;
        }
      }
      if (previewPage === page) editor?.refreshPreview();
    };
    const previewBody = (_, runtimeUrl) => {
      const src = previewData[previewPage];
      if (!src) return '<p style="padding:24px;font:13px sans-serif;color:#777">불러오는 중…</p>';
      if (previewPage === "works") return `<div data-filt-works></div><script src="${runtimeUrl("works.js")}" data-view="list" data-works-src="${src}" data-list-url="#" data-gallery-url="#"><\/script>`;
      if (previewPage === "project") return `<div data-filt-project="preview"></div><script src="${runtimeUrl("project-template.js")}" data-project-id="preview" data-project-src="${src}"><\/script>`;
      return `<div data-filt-page></div><script src="${runtimeUrl("pages.js")}" data-page="${previewPage}" data-page-src="${src}" data-works-url="#"><\/script>`;
    };
    const pageSelect = h("select", {
      class: "preview-page",
      title: "미리볼 페이지",
      onchange: (event) => showPage(event.target.value),
    }, PREVIEW_PAGES.map(([value, label]) => h("option", { value }, label)));

    editor = FiltPageEditor({
      page: "design",
      previewTools: [pageSelect],
      previewBody,
      assetKeys: [],
      load: async () => FiltStore.fullDesign(await FiltStore.getPage("design")),
      render: (ctx) => {
        const { h, data } = ctx;
        const apply = () => FiltStore.applyDesign(data);
        const changed = () => { apply(); ctx.markDirty(); };
        apply();

        const chapter = (no, title, note, tools, ...body) => h("section", { class: "chapter" },
          h("header", {}, h("span", { class: "no" }, no), h("h2", {}, title), note ? h("p", {}, note) : null, tools),
          h("div", {}, body));
        const num = (obj, key, { step = 1, min = 0, max = 999 } = {}) => h("input", {
          type: "number", step, min, max, value: obj[key],
          oninput: (event) => {
            const value = Number(event.target.value);
            if (event.target.value === "" || Number.isNaN(value)) return;
            obj[key] = value;
            changed();
          },
        });
        const select = (obj, key, options) => h("select", {
          onchange: (event) => {
            obj[key] = /^\d+$/.test(event.target.value) ? Number(event.target.value) : event.target.value;
            ctx.rerender();
            ctx.markDirty();
          },
        }, options.map(([value, label]) => h("option", { value, selected: String(value) === String(obj[key]) }, label)));
        const value = (label, control, wide = false) => h("label", { class: `value${wide ? " wide" : ""}` }, h("span", {}, label), control);

        // ---------- 01 colour ----------
        const colors = data.colors;
        const colorCard = (color, index) => {
          const swatch = h("div", { class: "swatch", title: "끌어서 순서 변경 · 맨 앞이 키컬러" }, index === 0 ? h("span", { class: "badge" }, "키컬러") : null);
          swatch.style.background = color.value;
          const setColor = (hexValue) => {
            color.value = hexValue.toUpperCase();
            swatch.style.background = color.value;
            picker.value = color.value;
            hex.value = color.value;
            changed();
          };
          const hex = h("input", { type: "text", class: "hex", size: 1, value: color.value, title: `--filt-${color.id} · 더블클릭하면 복사`, ondblclick: () => copyText(color.value, color.value, ctx.toast), oninput: (event) => { if (HEX_RE.test(event.target.value.trim())) setColor(event.target.value.trim()); } });
          const picker = h("input", { type: "color", value: color.value, title: "색 고르기", oninput: (event) => setColor(event.target.value) });
          swatch.append(picker);
          const el = h("div", { class: "color" }, swatch, ctx.input(color, "name", { placeholder: "이름", keepEmpty: true, size: 1 }), hex);
          FiltRowMenu.attach(el, {
            label: color.name || color.value,
            items: [{
              text: "삭제",
              hint: colors.length > 1 ? "이 색을 쓰던 곳은 기본값으로 돌아갑니다" : "색이 하나뿐이라 지울 수 없습니다",
              danger: true,
              run: () => {
                if (colors.length < 2 || !confirm(`${color.name || color.value}을(를) 삭제할까요?`)) return;
                colors.splice(colors.indexOf(color), 1);
                ctx.rerender();
                ctx.markDirty();
              },
            }],
          });
          return ctx.draggable(el, { list: colors, index, handle: swatch, axis: "x" });
        };

        // ---------- 02 logo ----------
        const morphBox = h("div", { class: "logo-box play", title: "눌러서 애니메이션 재생" }, h("span", {}, "애니메이션 · 눌러서 재생"));
        const morphSvg = markSvg("panel", "-10 -10 260 430");
        let stage = "panel";
        morphBox.append(morphSvg);
        morphBox.addEventListener("click", () => {
          const next = stage === "panel" ? "logo" : "panel";
          morph(morphSvg, stage, next, data.logo.duration, data.logo.ease);
          stage = next;
        });
        const copyButton = (label, what, make) => h("button", { class: "small copy", onclick: (event) => { event.stopPropagation(); copyText(make(), what, ctx.toast); } }, label);
        // The HOME intro, played in the box: scattered lines gather into the large mark.
        const introSvg = document.createElementNS(SVG_NS, "svg");
        INTRO_START.forEach(() => introSvg.append(document.createElementNS(SVG_NS, "path")));
        const introBox = h("div", { class: "logo-box intro play", title: "눌러서 인트로 재생" }, h("span", {}, "HOME 인트로 · 눌러서 재생"), introSvg,
          copyButton("SVG 복사", "인트로 큰 마크 SVG", () => svgMarkup(INTRO_MARK, "437 1148 305 260", 25, strokeColor(data))));
        introBox.addEventListener("click", () => playIntro(introBox, introSvg, data.logo.intro));
        requestAnimationFrame(() => { if (introBox.isConnected) playIntro(introBox, introSvg, { ...data.logo.intro, appear: 0, gather: 0.001 }); });
        const logoColors = [["black", "검정"], ...colors.map((color) => [color.id, color.name || color.value])];

        // ---------- 04 type scale ----------
        const scaleRow = (entry) => {
          const sample = h("td", { class: "sample" }, "건축은 장소를 읽는 일에서 시작한다 FILT Architects 2026");
          const paint = () => Object.assign(sample.style, { fontSize: `${entry.pc}px`, fontWeight: entry.weight, lineHeight: entry.line });
          paint();
          const cell = (key, step, min, max) => h("td", {}, h("input", {
            type: "number", step, min, max, value: entry[key],
            oninput: (event) => {
              const v = Number(event.target.value);
              if (event.target.value === "" || Number.isNaN(v)) return;
              entry[key] = v;
              paint();
              changed();
            },
          }));
          return h("tr", { title: `--filt-size-${entry.id} · --filt-size-${entry.id}-mobile · --filt-weight-${entry.id} · --filt-line-${entry.id}` },
            h("td", { class: "name" }, entry.name), sample,
            cell("pc", 0.5, 6, 96), cell("mobile", 0.5, 6, 96), cell("weight", 100, 100, 900), cell("line", 0.05, 0.8, 3));
        };

        // ---------- 05 motion ----------
        const panelBox = h("div", { class: "motion-box", title: "눌러서 패널 열고 닫기" },
          h("span", {}, "패널 · 눌러서 열고 닫기"), h("div", { class: "panel" }));
        panelBox.addEventListener("click", () => panelBox.classList.toggle("open"));
        const hoverBox = h("div", { class: "motion-box" }, h("span", {}, "메뉴 hover · 마우스를 올려 보세요"),
          h("div", { class: "links" }, ["OFFICE", "NEWS", "WORKS"].map((label) => h("a", { href: "#", onclick: (event) => event.preventDefault() }, label))));

        return h("div", { class: "guide" },
          chapter("01", "COLOR", "맨 앞 색이 키컬러(--filt-key)입니다. 메뉴 hover, 링크, 강조에 쓰입니다.",
            [h("button", { onclick: () => { colors.push({ id: nextId(colors), name: "", value: "#111111" }); ctx.rerender(); ctx.markDirty(); } }, "+ 색 추가"),
              h("button", { class: "copy-all", title: "색·로고·글씨·움직임 값 전체를 CSS 변수로 복사", onclick: () => copyText(cssMarkup(data), "디자인 시스템 CSS", ctx.toast) }, "CSS 전체 복사")],
            h("div", { class: "colors" }, colors.map(colorCard))),

          chapter("02", "LOGO", "FILT 마크는 선 12개로 그립니다. 메뉴 패널에서 접힌 마크와 펼쳐진 로고 사이를 오갑니다.", null,
            h("div", { class: "logo-stage" },
              h("div", { class: "logo-box mark" }, h("span", {}, "접힌 마크"), markSvg("panel", "15 262 72 60"),
                copyButton("SVG 복사", "접힌 마크 SVG", () => svgMarkup(SHAPES.panel.map(ends), "15 262 72 60", data.logo.stroke, strokeColor(data)))),
              h("div", { class: "logo-box" }, h("span", {}, "로고"), markSvg("logo", "-10 -10 260 430"),
                copyButton("SVG 복사", "로고 SVG", () => svgMarkup(SHAPES.logo.map(ends), "-10 -10 260 430", data.logo.stroke, strokeColor(data)))),
              morphBox,
              introBox),
            h("div", { class: "values" },
              value("선 두께", num(data.logo, "stroke", { step: 0.5, min: 0.5, max: 20 })),
              value("선 색", select(data.logo, "color", logoColors)),
              value("애니메이션 시간 (초)", num(data.logo, "duration", { step: 0.05, min: 0.1, max: 5 })),
              value("가속", select(data.logo, "ease", EASES)),
              value("인트로: 큰 마크 크기", num(data.logo.intro, "scale", { step: 0.05, min: 0.1, max: 2 })),
              value("인트로: 나타남 (초)", num(data.logo.intro, "appear", { step: 0.05, min: 0, max: 3 })),
              value("인트로: 모임 (초)", num(data.logo.intro, "gather", { step: 0.1, min: 0.1, max: 6 })),
              value("인트로: 멈춤 (초)", num(data.logo.intro, "hold", { step: 0.05, min: 0, max: 3 })),
              value("인트로: 메뉴로 이동 (초)", num(data.logo.intro, "dock", { step: 0.1, min: 0.1, max: 4 })))),

          chapter("03", "TYPEFACE", "사이트 전체의 글꼴과 기본 굵기입니다.", null,
            h("p", { class: "family-sample" }, "FILT. Architects 건축사사무소", h("small", {}, "가나다라마바사 ABCDEFG abcdefg 0123456789")),
            h("div", { class: "values" },
              value("글꼴", select(data.type, "family", [
                ["'Suit', 'Pretendard Variable', 'Noto Sans KR', sans-serif", "SUIT"],
                ["'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif", "Pretendard"],
              ])),
              value("기본 굵기", select(data.type, "weight", [[200, "200 Light"], [300, "300 (기본)"], [400, "400 Regular"], [500, "500 Medium"]])))),

          chapter("04", "TYPE SCALE", "글씨 크기 체계입니다. PC 크기는 넓은 화면 기준의 최대값이고, 좁은 화면에서는 같은 비율로 줄어듭니다.", null,
            h("table", { class: "scale" },
              h("thead", {}, h("tr", {}, ["", "예시 (PC)", "PC px", "모바일 px", "굵기", "행간"].map((label) => h("th", {}, label)))),
              h("tbody", {}, data.type.scale.map(scaleRow)))),

          chapter("05", "MOTION", "패널이 열리고 닫히는 시간과 메뉴 hover 시간입니다.", null,
            h("div", { class: "motion-demo" }, panelBox, hoverBox),
            h("div", { class: "values" },
              value("패널 (초)", num(data.motion, "panel", { step: 0.05, min: 0, max: 3 })),
              value("hover (초)", num(data.motion, "hover", { step: 0.05, min: 0, max: 3 })),
              value("HOME 슬라이드 넘김 (초)", num(data.motion, "slide", { step: 0.1, min: 0, max: 5 })),
              value("HOME 슬라이드 간격 (초)", num(data.motion, "slideInterval", { step: 1, min: 2, max: 60 })))),

          chapter("06", "LAYOUT", "템플릿에 고정된 값입니다 (여기서는 바꾸지 않습니다).", null,
            h("ul", { class: "facts" },
              [["모바일 기준", "화면 너비 768px 이하"], ["상세페이지 오른쪽 패널", "300 – 430px (화면의 28%)"], ["접힌 메뉴 패널", "210px 숨김, 30px 보임"],
                ["이미지 크기", "PC 2560px, 모바일 1600px로 줄여서 게시"], ["이미지 여백", "작은 여백 7vmin, 큰 여백 15vmin"]]
                .map(([label, text]) => h("li", {}, h("b", {}, label), h("span", {}, text))))));
      },
    });
    // First preview after sign-in: the design is applied once the header is mounted.
    document.addEventListener("filt-design", () => showPage(previewPage), { once: true });
  })();
  </script>
</body>
</html>
