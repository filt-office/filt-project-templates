<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEWS · FILT. BUILDER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suit-font@1.0.0/dist/suit.min.css">
  <style>
    .recruit-sheet textarea { display: block; width: 100%; min-width: 240px; min-height: 76px; padding: 8px; border: 0; background: #fff; color: inherit; font: inherit; line-height: 1.5; resize: vertical; }
    .recruit-note { margin-top: 8px; border: 1px solid #111; }
    .recruit-note textarea { display: block; width: 100%; min-height: 72px; padding: 8px; border: 0; background: #fff; color: inherit; font: inherit; line-height: 1.5; resize: vertical; }
  </style>
</head>
<body>
  <header class="fb-header" data-active="news">
    <div class="fb-actions" id="account">
      <span class="dirty" id="dirty" title="저장 안 됨">●</span>
      <button class="fb-act" disabled title="NEWS는 임시저장이 없습니다. save가 바로 게시 대상에 저장합니다.">draft</button>
      <button id="save" class="fb-act" title="저장 (Ctrl+S)">save</button>
    </div>
  </header>
  <script src="header.js"></script>
  <script src="store.js"></script>
  <script src="add-controls.js"></script>
  <script src="row-menu.js"></script>
  <script src="page-editor.js"></script>
  <script>
  (() => {
    "use strict";

    const today = () => new Date().toISOString().slice(0, 10).replace(/-/g, "/");

    FiltPageEditor({
      page: "news",
      render: (ctx) => {
        const { h, data } = ctx;
        data.news = data.news || [];
        data.recruit = data.recruit || [];
        const cell = (obj, key, size = "mid", props) => h("td", { class: size }, ctx.input(obj, key, props));
        const textBox = (obj, key, props = {}) => h("textarea", {
          rows: 3,
          oninput: (event) => { obj[key] = event.target.value; ctx.markDirty(); },
          ...props,
        }, obj[key] ?? "");

        // NEWS retains its editorial fields; RECRUIT has dedicated hiring fields.
        // Drag a row by its number to reorder; right-click it to archive or delete.
        const sheet = (list) => ctx.sheet(
          ["#", "제목", "모바일 제목 (다를 때만)", "날짜", "종류", "작성자", "이미지", "본문 (모바일에서 펼침)", "링크"],
          list.map((entry, index) => {
            const num = h("td", { class: "num" }, String(index + 1));
            const tr = h("tr", {},
              num,
              cell(entry, "title", "wide", { keepEmpty: true }),
              cell(entry, "mobileTitle", "mid"),
              cell(entry, "date", "short", { placeholder: "2026/01/31", keepEmpty: true }),
              cell(entry, "type", "short", { placeholder: "Lecture", keepEmpty: true }),
              cell(entry, "author", "short", { keepEmpty: true }),
              h("td", { class: "img" }, ctx.image(entry, "image")),
              cell(entry, "text", "wide"),
              cell(entry, "link", "mid", { placeholder: "누르면 이동할 주소" }));
            ctx.menu(tr, list, index, entry.title ? `"${entry.title}"` : "이 행");
            return ctx.draggable(tr, { list, index, handle: num });
          }));
        const recruitSheet = (list) => {
          const table = ctx.sheet(
            ["#", "제목", "모바일 제목 (다를 때만)", "모집 분야", "모집 요건", "제출물", "마감일", "이미지 (썸네일)"],
            list.map((entry, index) => {
              const num = h("td", { class: "num" }, String(index + 1));
              const name = `RECRUIT ${index + 1}번`;
              const tr = h("tr", {},
                num,
                cell(entry, "title", "wide", { keepEmpty: true, placeholder: "예: 건축설계 신입·경력 모집", "aria-label": `${name} 제목` }),
                cell(entry, "mobileTitle", "mid", { placeholder: "비우면 제목과 동일", "aria-label": `${name} 모바일 제목` }),
                cell(entry, "field", "mid", { placeholder: "짧게 · 예: 건축설계 인턴", title: "PC 목록 한 칸에 들어가므로 짧게 적어주세요", "aria-label": `${name} 모집 분야` }),
                h("td", { class: "wide" }, textBox(entry, "requirements", { placeholder: "경력, 자격, 사용 프로그램 등", "aria-label": `${name} 모집 요건` })),
                h("td", { class: "wide" }, textBox(entry, "submissions", { placeholder: "이력서, 포트폴리오, 제출 방법 등", "aria-label": `${name} 제출물` })),
                cell(entry, "deadline", "mid", { placeholder: "상시모집 / YYYY/MM/DD", "aria-label": `${name} 마감일` }),
                h("td", { class: "img" }, ctx.image(entry, "image")));
              ctx.menu(tr, list, index, entry.title ? `"${entry.title}"` : "이 공고");
              return ctx.draggable(tr, { list, index, handle: num });
            }));
          table.classList.add("recruit-sheet");
          return table;
        };
        const addTop = (list, label, makeEntry) => FiltAdd.line(label, () => {
            list.unshift(makeEntry());
            ctx.rerender();
            ctx.markDirty();
          });

        return [
          ctx.section(`NEWS (${data.news.length})`, null, sheet(data.news), addTop(data.news, "NEWS 행 추가 (맨 위)", () => ({ title: "", date: today(), type: "", author: "" }))),
          ctx.section(`RECRUIT (${data.recruit.length})`, null,
            recruitSheet(data.recruit),
            addTop(data.recruit, "RECRUIT 공고 추가 (맨 위)", () => ({ title: "", mobileTitle: "", field: "", requirements: "", submissions: "", deadline: "", image: "" })),
            h("div", { class: "recruit-note" },
              textBox(data, "recruitEmpty", { placeholder: "채용 관련 안내를 자유롭게 입력하세요.", "aria-label": "RECRUIT 안내 텍스트" }))),
        ];
      },
    });
  })();
  </script>
</body>
</html>
